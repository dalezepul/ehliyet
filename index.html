<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1446">
<title>Ehliyet Koala</title>
<style>
:root{
  --bg1:#170f3d; --bg2:#2d1b69; --ink:#1f1a3d; --muted:#6b6790;
  --pri:#7c5cff; --pri-d:#5b3fd9; --pri-l:#c4b5fd;
  --ok:#22c55e; --ok-d:#15803d; --bad:#ef4444; --bad-d:#b91c1c;
  --gold:#fbbf24; --pink:#ff6ba6; --cyan:#22d3ee;
  --glass:rgba(255,255,255,.08); --glass-b:rgba(255,255,255,.14);
  --r:22px;
  --font:"Segoe UI Variable Display","Segoe UI","SF Pro Rounded",ui-rounded,system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.2,1.5,.4,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100dvh;color:#fff;font-family:var(--font);overflow-x:hidden;
  background:radial-gradient(120% 80% at 50% -10%,#3b2a8f 0%,transparent 60%),linear-gradient(165deg,var(--bg1),var(--bg2) 60%,#1a1050)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;line-height:1.15}
h2.sec{font-size:15px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:26px 4px 12px}

/* ---------- arka plan ---------- */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.35;animation:drift 22s ease-in-out infinite alternate}
.blob.a{background:radial-gradient(circle,#ff6ba6 0%,transparent 60%);top:-25vmax;left:-20vmax}
.blob.b{background:radial-gradient(circle,#22d3ee 0%,transparent 60%);bottom:-30vmax;right:-25vmax;animation-delay:-8s}
.blob.c{background:radial-gradient(circle,#7c5cff 0%,transparent 60%);top:30%;left:40%;animation-duration:30s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1.2)}}
.floater{position:absolute;font-size:22px;opacity:.18;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}

#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.screen{animation:screenIn .45s var(--spring) both}
.screen.leaving{animation:screenOut .2s ease-in both}
@keyframes screenIn{from{opacity:0;transform:translateY(24px) scale(.98)}}
@keyframes screenOut{to{opacity:0;transform:translateY(-12px) scale(.98)}}
.stagger>*{animation:popIn .5s var(--spring) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.94)}}

.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-weight:800;font-size:16px;
  background:var(--pri);box-shadow:0 5px 0 var(--pri-d);transition:transform .1s,box-shadow .1s,filter .2s;min-height:50px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.btn.gold{background:var(--gold);color:#3b2600;box-shadow:0 5px 0 #b7791f}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.node:focus-visible,.tile:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

/* ---------- üst bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.02em}
.brand span{background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:4px}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:800;font-size:14px;white-space:nowrap}
.chip.fire.on{background:linear-gradient(135deg,#ff8a00,#ff3d6e);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px rgba(255,90,60,.7)}}

/* ---------- maskot ---------- */
.owl{width:110px;height:auto;overflow:visible;flex:none}
.owl .body{transform-origin:60px 120px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.owl .lid{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.owl .pupil{transition:transform .3s}
.owl .heart{transform-box:fill-box;transform-origin:center;animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.owl .ear{transform-box:fill-box;transform-origin:center bottom;animation:ear 3.8s ease-in-out infinite}
.owl .ear.r{animation-delay:-1.9s}
.owl .baby{transform-box:fill-box;transform-origin:center bottom;animation:babyBob 2.2s ease-in-out infinite}
@keyframes babyBob{50%{transform:translateY(-3px) rotate(5deg)}}
.owl.happy .baby{animation:hop .5s var(--spring) 3}
@keyframes ear{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-9deg)}94%{transform:rotate(7deg)}}
.owl .wing{transform-box:fill-box;transform-origin:top center}
.owl .joy,.owl .brow{opacity:0;transition:opacity .2s}
.owl.happy .body{animation:hop .6s var(--spring) 2}
.owl.happy .eyes{opacity:0}.owl.happy .joy{opacity:1}
.owl.happy .wing.l{animation:flapL .3s ease-in-out 4}.owl.happy .wing.r{animation:flapR .3s ease-in-out 4}
@keyframes hop{40%{transform:translateY(-16px) scale(1.04,.96)}}
@keyframes flapL{50%{transform:rotate(35deg)}}@keyframes flapR{50%{transform:rotate(-35deg)}}
.owl.sad .body{animation:droop 1.2s ease-in-out both}
.owl.sad .brow{opacity:1}.owl.sad .pupil{transform:translateY(4px)}
@keyframes droop{30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}100%{transform:translateY(3px)}}
.owl.think .pupil{transform:translate(4px,-4px)}
.speaker{display:flex;align-items:flex-end;gap:12px}
.bubble{position:relative;background:#fff;color:var(--ink);padding:12px 15px;border-radius:18px 18px 18px 4px;font-weight:700;font-size:15px;line-height:1.4;
  animation:bubble .55s var(--spring) both .15s;box-shadow:0 6px 0 rgba(0,0,0,.18)}
@keyframes bubble{from{opacity:0;transform:scale(.4) translate(-30px,20px)}}

/* ---------- ana sayfa ---------- */
.hero{padding:18px}
.lvl{margin-top:16px}
.lvl-row{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:7px}
.lvl-row small{opacity:.7;font-weight:700}
.bar{height:14px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--pink));width:0;transition:width 1s var(--spring);position:relative;overflow:hidden}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:shimmer 2.2s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{text-align:center;padding:12px 6px;border-radius:16px;background:rgba(0,0,0,.18)}
.stat b{display:block;font-size:22px;font-weight:900}
.stat>span{font-size:12px;opacity:.75;font-weight:700}
.cta{margin-top:16px;font-size:18px;min-height:56px;animation:popIn .5s var(--spring) both,ctaPulse 2.4s ease-in-out 1s infinite}
@keyframes ctaPulse{50%{transform:scale(1.03);box-shadow:0 5px 0 #b7791f,0 0 26px rgba(251,191,36,.55)}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{padding:14px 8px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-b);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s var(--spring),background .2s;position:relative}
.tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.14)}
.tile .ic{font-size:26px}
.tile .badge-n{position:absolute;top:6px;right:8px;background:var(--bad);border-radius:99px;font-size:11px;padding:2px 7px}

/* harita */
.map{position:relative;margin:0 auto;max-width:440px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map{--c:#7c5cff}
.map::before{content:"";position:absolute;inset:0 -15%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 16%,transparent),transparent);pointer-events:none}
.map .path path{fill:none;stroke:color-mix(in srgb,var(--c) 55%,transparent);stroke-width:5;stroke-dasharray:2 14;stroke-linecap:round;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:26px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));box-shadow:0 7px 0 color-mix(in srgb,var(--c) 50%,#000),0 12px 22px rgba(0,0,0,.35);transition:transform .2s var(--spring);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.node:hover{transform:translate(-50%,-50%) scale(1.08)}
.node:active{transform:translate(-50%,-46%)}
.node.done{background:linear-gradient(160deg,#fcd34d,#f59e0b);box-shadow:0 7px 0 #b45309,0 12px 22px rgba(0,0,0,.35);color:#4a2c00}
.node.locked{background:#3a3363;box-shadow:0 7px 0 #262046;color:rgba(255,255,255,.35);cursor:not-allowed}
.node.cur{animation:nodeBounce 1.6s var(--spring) infinite}
.node.cur::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--c);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes nodeBounce{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(-50%,-62%)}40%{transform:translate(-50%,-50%)}}
.node .stars{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:-1px;white-space:nowrap}
.node .stars .off{filter:grayscale(1);opacity:.3}
.node .lbl{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:12px;font-weight:900;padding:4px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.node .lbl::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.bdg{text-align:center;padding:12px 6px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);font-size:12px;font-weight:700;line-height:1.25}
.bdg .e{font-size:30px;display:block;margin-bottom:4px}
.bdg.off{opacity:.35}.bdg.off .e{filter:grayscale(1)}
.bdg.on .e{animation:bdgWiggle 3s ease-in-out infinite}
@keyframes bdgWiggle{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-12deg) scale(1.15)}95%{transform:rotate(12deg) scale(1.15)}}
.yollar{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
.yollar::-webkit-scrollbar{display:none}
.yol{flex:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:16px;font-weight:800;font-size:14px;background:rgba(255,255,255,.07);
  border:2px solid color-mix(in srgb,var(--c) 55%,transparent);transition:transform .25s var(--spring),background .2s}
.yol small{opacity:.75;font-size:11px}
.yol:hover{transform:translateY(-2px)}
.yol.on{background:var(--c);color:#1b1035;border-color:var(--c);transform:scale(1.06);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 55%,transparent)}
.yol:focus-visible{outline:3px solid #fff;outline-offset:2px}
h2.yolbas{opacity:1;color:var(--c)}
.isim{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--glass-b);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-weight:700;margin-bottom:14px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;justify-content:center;font-size:12px;opacity:.75}
.pool span{padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.08)}

/* ---------- quiz ---------- */
.quiz{max-width:680px;margin:0 auto;padding-bottom:40px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .x{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);font-size:18px;font-weight:900;flex:none}
.qtop .bar{flex:1;height:18px}
.qtop .bar>i{background:linear-gradient(90deg,var(--ok),#a3e635)}
.combo{font-weight:900;min-width:58px;text-align:right;font-size:16px;transition:transform .3s var(--spring)}
.combo.hot{color:var(--gold);animation:comboPop .5s var(--spring)}
@keyframes comboPop{40%{transform:scale(1.6) rotate(-8deg)}}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px;font-weight:800;font-size:13px}
.dchip{padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 28%,transparent);border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.qcard{background:#fff;color:var(--ink);border-radius:24px;padding:22px 20px;font-size:17px;line-height:1.6;box-shadow:0 8px 0 rgba(0,0,0,.18);
  animation:cardIn .55s var(--spring) both;white-space:pre-line;font-weight:500}
.qcard u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(3deg)}}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:16px;background:#fff;color:var(--ink);font-size:16px;font-weight:600;line-height:1.4;
  border:2px solid #e3defc;border-bottom-width:5px;transition:transform .12s,border-color .2s,background .2s,opacity .3s;animation:popIn .45s var(--spring) both;animation-delay:calc(.15s + var(--i)*55ms);min-height:56px}
.opt:hover:not(:disabled){border-color:var(--pri-l);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt .l{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#f0edff;color:var(--pri-d);font-weight:900}
.opt:disabled{cursor:default}
.opt.ok{background:#dcfce7;border-color:var(--ok);animation:okPulse .6s var(--spring)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{background:#fee2e2;border-color:var(--bad);animation:shake .45s}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
@keyframes okPulse{40%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);transition:transform .45s var(--spring);padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.sheet-in{max-width:680px;margin:0 auto;border-radius:24px;padding:16px;color:var(--ink);max-height:62vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.okk .sheet-in{background:#d9fbe5}
.sheet.badd .sheet-in{background:#ffe1e1}
.sheet .speaker .owl{width:64px}
.sheet h3{font-size:20px;font-weight:900}
.sheet .btn{color:#fff}
.sheet.okk h3{color:var(--ok-d)}.sheet.badd h3{color:var(--bad-d)}
.sheet .exp{margin:10px 0 14px;font-size:15px;line-height:1.55;white-space:pre-line}
.sheet .exp b{color:var(--ink)}
.sheet .src{font-size:12px;opacity:.7;word-break:break-all}
.xpfloat{position:fixed;z-index:30;font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 2px 0 #7a4b00;pointer-events:none;animation:xpUp 1.1s ease-out forwards}
@keyframes xpUp{from{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-20px) scale(1.2)}to{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.kbd{font-size:12px;opacity:.5;text-align:center;margin-top:14px}
@media (hover:none){.kbd{display:none}}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(14,8,40,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .3s both}
.overlay.out{animation:fadeOut .25s both}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.ov-card{text-align:center;max-width:380px;width:100%;animation:ovIn .6s var(--spring) both}
@keyframes ovIn{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
.ov-card .owl{width:150px;margin:0 auto 8px;display:block}
.ov-card h2{font-size:28px;font-weight:900;margin-bottom:10px}
.ov-card p{font-size:17px;line-height:1.5;opacity:.92;margin:0 0 8px}
.ov-card .tip{display:inline-block;margin:10px 0 22px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.1);font-size:14px;font-weight:700}
.count{font-size:120px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;animation:countPop .8s var(--spring) both}
@keyframes countPop{from{transform:scale(2.5);opacity:0}60%{opacity:1}to{transform:scale(1)}}
.breath{width:120px;height:120px;margin:6px auto 14px;border-radius:50%;background:radial-gradient(circle,var(--cyan),transparent 70%);animation:breath 8s ease-in-out infinite;display:grid;place-items:center;font-weight:800;font-size:13px}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}

/* ---------- sonuç ---------- */
.result{max-width:560px;margin:0 auto;text-align:center}
.ring{width:190px;height:190px;margin:10px auto;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.12) 0);transition:--p 1s;animation:popIn .6s var(--spring) both}
@property --p{syntax:"<number>";inherits:false;initial-value:0}
.ring>div{width:150px;height:150px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;align-content:center}
.ring b{font-size:46px;font-weight:900}.ring span{font-size:13px;opacity:.7;font-weight:700}
.bigstars{display:flex;justify-content:center;gap:10px;font-size:52px;margin:6px 0}
.bigstars i{font-style:normal;display:inline-block;animation:starIn .7s var(--spring) both}
.bigstars i.off{filter:grayscale(1) brightness(.6);opacity:.4}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.racts{display:grid;gap:12px;margin-top:8px}
.review{text-align:left;margin-top:26px}
.rv{padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);margin-bottom:8px}
.rv summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;gap:8px}
.rv summary::-webkit-details-marker{display:none}
.rv .body{font-size:14px;line-height:1.55;margin-top:10px;opacity:.9;white-space:pre-line}

.toast{position:fixed;top:14px;left:50%;z-index:50;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:18px;
  background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#3b2600;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:toast 3.6s var(--spring) forwards;width:max-content;max-width:calc(100vw - 32px)}
.turrow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:14px 0;font-weight:700;font-size:14px}
.turrow .bar{grid-column:1/-1;height:9px}.turrow .bar>i{background:var(--c)}
.toast .e{font-size:28px}
@keyframes toast{0%{transform:translate(-50%,-140%)}12%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-140%)}}
.qimg{display:flex;justify-content:center;margin:-2px 0 14px;white-space:normal}
.qimg .isaret{width:132px;height:132px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.isaret.isk-sik{width:64px;height:64px;flex:none}
.rv .qimg .isaret{width:90px;height:90px}
.isk-blink{animation:iskBlink 1s steps(2) infinite}@keyframes iskBlink{50%{opacity:.12}}
.opt.sec{border-color:var(--pri);background:#efeaff}.opt.sec .l{background:var(--pri);color:#fff}

el uygulamaları Koruma, Bildirme ve Kurtarmadır."},{"d":"ilkyardim","k":"İlk yardımın tanımı ve amaçları","q":"I. Olay yerinde tehlikeleri belirleyerek güvenli bir çevre oluşturmak\nII. Olayı en kısa sürede 112'ye bildirmek\nIII. Kazazedeye olay yerinde hızlı ve doğru müdahale etmek\nVerilenlerden hangileri ilk yardımın temel uygulamaları arasındadır?","o":["Yalnız I","I ve II","II ve III","I, II ve III"],"a":3,"c":"Koruma (I), bildirme (II) ve kurtarma (III) ilk yardımın üç temel uygulamasıdır."},{"d":"ilkyardim","k":"İlk yardımın tanımı ve amaçları","q":"Acil tedavi ile ilgili aşağıdakilerden hangisi doğrudur?","o":["Sağlık personeli tarafından tıbbi araç ve ilaç kullanılarak yapılır.","Olay yerindeki herkes tarafından ilaçsız olarak yapılır.","Yalnızca kazazedenin yakınları tarafından uygulanır.","İlk yardımcının yaptığı uygulamaların genel adıdır."],"a":0,"c":"Acil tedavi; hekim ve sağlık personelinin tıbbi malzeme ve ilaçla yaptığı müdahaledir."},{"d":"ilkyardim","k":"İlk yardımın tanımı ve amaçları","q":"Birden fazla yaralının bulunduğu bir kazada ilk yardımcı **öncelikle** hangi yaralıya müdahale etmelidir?","o":["Bağırarak yardım isteyen yaralıya","Kolunda kapalı kırık şüphesi olan yaralıya","Solunumu ve dolaşımı tehlikede olan yaralıya","Yüzünde yüzeysel sıyrıklar bulunan yaralıya"],"a":2,"c":"Önce hayati tehlikesi olan, yani hava yolu, solunum ve dolaşımı tehlikede olan yaralıya müdahale edilir; sessiz yaralı daha ağır olabilir."},{"d":"ilkyardim","k":"İlk yardımcının özellikleri","q":"Aşağıdakilerden hangisi bir ilk yardımcıda bulunması gereken özelliklerden biri **değildir**?","o":["Yaralının durumuna göre ilaç seçip uygulayabilmek","Sakin, kendine güvenen ve pratik olmak","Çevredeki kişileri organize edebilmek","Yaralıyla ve 112 ile etkili iletişim kurabilmek"],"a":0,"c":"İlk yardımcı ilaç uygulamaz; sakin, pratik ve iletişimi güçlü olmalıdır."},{"d":"ilkyardim","k":"İlk yardımcının özellikleri","q":"İlk yardımcının olay yerinde yaralıya kendini tanıtmasının temel amacı aşağıdakilerden hangisidir?","o":["Yaralıdan ücret talep etmek","Yaralıya güven vermek ve onun iş birliğini sağlamak","Yaralının yakınlarına haber vermek","Kazanın kusurlusunu belirlemek"],"a":1,"c":"Kendini tanıtan ilk yardımcı kazazedeye güven verir, kaygısını azaltır ve iş birliğini kolaylaştırır."},{"d":"ilkyardim","k":"İlk yardımcının özellikleri","q":"İlk yardımcının yaralıya yaklaşımıyla ilgili aşağıdakilerden hangisi **yanlıştır**?","o":["Yaralıya moral vermeli ve onu sakinleştirmelidir.","Kendi güvenliğini tehlikeye atmamalıdır.","Bilgisi ve becerisi olmadığı uygulamaları da denemelidir.","Yaralıyı gereksiz yere hareket ettirmemelidir."],"a":2,"c":"İlk yardımcı bilmediği bir uygulamayı denememelidir; yanlış müdahale yaralıya zarar verebilir."},{"d":"ilkyardim","k":"Hayat kurtarma zinciri","q":"Aşağıdakilerden hangisi hayat kurtarma zincirinin halkalarından biri **değildir**?","o":["Yaralıya olay yerinde ağrı kesici verilmesi","Sağlık kuruluşuna (112) haber verilmesi","Olay yerinde temel yaşam desteği yapılması","Ambulans ekibince müdahale edilmesi"],"a":0,"c":"Hayat kurtarma zincirinde ilaç uygulaması yer almaz; zincir bildirim, temel yaşam desteği ve profesyonel bakımı kapsar."},{"d":"ilkyardim","k":"Hayat kurtarma zinciri","q":"Hayat kurtarma zinciri ile ilgili aşağıdakilerden hangisi doğrudur?","o":["Zincir yalnızca hastanede başlar.","Halkalardan biri aksarsa yaralının yaşama şansı azalır.","Zincirde ilk yardımcının hiçbir rolü yoktur.","Halkaların sırası önemli değildir."],"a":1,"c":"Zincirin halkaları birbirine bağlıdır; birinin eksik kalması hayatta kalma olasılığını düşürür."},{"d":"ilkyardim","k":"Olay yeri değerlendirmesi ve güvenliği","q":"Trafik kazası yerinde güvenliği sağlamak amacıyla aşağıdakilerden hangisi yapılmaz?","o":["Kazaya karışan aracın kontağının kapatılması","Uygun mesafeye reflektör (yansıtıcı üçgen) konulması","Kaza yapan aracın yanında sigara içilmesi","Meraklı kalabalığın olay yerinden uzaklaştırılması"],"a": uğu ve olay yerinin adresi\nII. Yaralıların sayısı ve durumları\nIII. Arayan kişinin adı ve kullandığı telefon numarası\n112 arandığında verilenlerden hangileri bildirilmelidir?","o":["Yalnız I","I ve II","II ve III","I, II ve III"],"a":3,"c":"Olay, adres, yaralı sayısı-durumu ve arayanın kimliği ile telefon numarası bildirilir."},{"d":"ilkyardim","k":"112 acil çağrı","q":"Tek başına olan bir ilk yardımcı, tepkisiz ve normal solunumu olmayan bir yetişkini fark ettiğinde aşağıdakilerden hangisini yapmalıdır?","o":["112'yi aramadan 30 dakika boyunca temel yaşam desteği yapmalıdır.","Yaralıyı bırakıp yardım çağırmak için uzaklaşmalı, dönünce değerlendirme yapmalıdır.","Önce 112'yi aramalı, telefonu hoparlöre alarak temel yaşam desteğine başlamalıdır.","Yaralıyı koma pozisyonuna getirip beklemelidir."],"a":2,"c":"Yetişkinde önce 112 aranır; telefon hoparlöre alınarak görevlinin yönlendirmesiyle göğüs basısına başlanır."},{"d":"ilkyardim","k":"Vücut sistemleri","q":"Temiz kanı kalpten vücuda taşıyan damarlara ne ad verilir?","o":["Toplardamar","Kılcal damar","Lenf damarı","Atardamar"],"a":3,"c":"Atardamarlar kanı kalpten vücuda taşır; toplardamarlar ise kanı kalbe geri getirir."},{"d":"ilkyardim","k":"Vücut sistemleri","q":"Atardamar ile toplardamarlar arasında bağlantıyı sağlayan ve gaz alışverişinin gerçekleştiği damarlar hangileridir?","o":["Kılcal damarlar","Şah damarları","Ana toplardamarlar","Akciğer atardamarları"],"a":0,"c":"Doku ile kan arasındaki madde ve gaz alışverişi ince duvarlı kılcal damarlarda olur."},{"d":"ilkyardim","k":"Vücut sistemleri","q":"Aşağıdakilerden hangisi solunum sisteminin organlarından biri **değildir**?","o":["Gırtlak","Mide","Soluk borusu","Akciğerler"],"a":1,"c":"Mide sindirim sistemine aittir; gırtlak, soluk borusu ve akciğerler solunum sistemi organlarıdır."},{"d":"ilkyardim","k":"Vücut sistemleri","q":"Beyin ve omurilikten oluşan, vücudun tüm faaliyetlerini yöneten sistem aşağıdakilerden hangisidir?","o":["Dolaşım sistemi","Hareket sistemi","Merkezî sinir sistemi","Boşaltım sistemi"],"a":2,"c":"Beyin ve omurilik merkezî sinir sistemini oluşturur."},{"d":"ilkyardim","k":"Vücut sistemleri","q":"Omurilik vücutta hangi yapının içinde korunur?","o":["Göğüs kafesi","Kafatası","Leğen kemiği","Omurga"],"a":3,"c":"Omurilik omurların oluşturduğu kanal içinde yer alır; omurga yaralanmalarında bu nedenle hareket ettirmekten kaçınılır."},{"d":"ilkyardim","k":"Vücut sistemleri","q":"Yetişkinlerde nabız genellikle hangi atardamardan kontrol edilir?","o":["Şah damarı (boyun)","Kasık atardamarı","Ayak sırtı atardamarı","Kol üst iç yüzündeki atardamar"],"a":0,"c":"Yetişkinde nabız boyundaki şah damarından alınır; bebekte kol iç yüzündeki atardamar tercih edilir."},{"d":"ilkyardim","k":"Hasta/yaralının değerlendirilmesi","q":"Yetişkin bir yaralının bilinç durumu nasıl kontrol edilir?","o":["Yüzüne su serpilerek","Omuzlarına hafifçe dokunup \"İyi misiniz?\" diye seslenilerek","Şiddetle sarsılarak","Göğsüne sertçe vurularak"],"a":1,"c":"Bilinç; omuzlara hafifçe dokunup yüksek sesle seslenerek değerlendirilir, yaralı sarsılmaz."},{"d":"ilkyardim","k":"Hasta/yaralının değerlendirilmesi","q":"Bebeklerde bilinç kontrolü nasıl yapılır?","o":["Bebek havaya kaldırılıp sallanarak","Yüzüne soğuk su dökülerek","Ayak tabanına hafifçe dokunularak veya vurularak","Göğsüne bastırılarak"],"a":2,"c":"Bebeklerde bilinç, ayak tabanına hafifçe dokunularak ya da fiske vurularak kontrol edilir."},{"d":"ilkyardim","k":"Hasta/yaralının değerlendirilmesi","q":"İlk yardımda hasta veya yaralının değerlendirilmesinde kullanılan \"ABC\" kısaltmasındaki \"B\" neyi ifade eder?","o":["Bilinç kontrolünü","Kanamanın durdurulmasını","Kırıkların tespitini","Solunumun değerlendirilmesini"],"a":3,"c":"A hava yolu açıklığı, B solunum, C dolaşımdır."},{"d":"ilkyardim","k":"Hasta/yaralının değerlendirilmesi","q":"Solunumun bak-dinle-hisset yöntemiyle değerlendirilmesi en fazla kaç saniye sürmelidir?","o":["10","20","30","60"],"a":0,"c":"Normal solunum 10 saniyeyi geçmeyecek şekilde bak-dinle-hisset yöntemiyle değerlendirilir."},{"d":"ilkyardim","k":"Hasta/yaralının değerlendirilmesi","q":"Bilinci kapalı ve boyun yaralanması şüphesi bulunmayan bir yaralıda hava yolunu açmak için hangi yöntem uygulanır?","o":["Baş geri-çene yukarı pozisyonu","Başın öne eğilmesi","Yaralının oturtulması","Bacakların yukarı kaldırılması"],"a":0,"c":"Bilinçsiz kişide dil hava yolunu tıkayabilir; baş geri-çene yukarı pozisyonu hava yolunu açar."},{"d":"ilkyardim","k":"Hasta/yaralının değerlendirilmesi","q":"Bilinci kapalı yaralıda hava yolu tıkanmasının en sık nedeni aşağıdakilerden hangisidir?","o":["Burun kanaması","Dilin geriye kayması","Gözlerin kapalı olması","Kolların bükülü olması"],"a":1,"c":"Bilinç kaybında kaslar gevşer ve dil geriye kayarak hava yolunu tıkar."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Yetişkinlerde temel yaşam desteği uygulanırken göğüs basısı ile kurtarıcı soluk oranı nasıl olmalıdır?","o":["15:1","15:2","30:2","30:5"],"a":2,"c":"Yetişkinde 30 göğüs basısı ve 2 kurtarıcı soluk dönüşümlü uygulanır."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Temel yaşam desteğinde göğüs basısı dakikada kaç kez olacak hızda uygulanmalıdır?","o":["60-80","80-100","100-120","120-140"],"a":2,"c":"Göğüs basısı her yaşta dakikada 100-120 hızında uygulanır."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Yetişkinde göğüs basısı uygulanırken göğüs kemiği ne kadar aşağı inmelidir?","o":["2-3 cm","3-4 cm","4-5 cm","5-6 cm"],"a":3,"c":"Yetişkinde göğüs en az 5 cm, en fazla 6 cm çöktürülür."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Yetişkinde göğüs basısı için ellerin yerleştirileceği doğru bölge aşağıdakilerden hangisidir?","o":["Göğüs kemiğinin en üst ucu","Midenin üzeri","Göğüs kemiğinin alt yarısı (göğsün ortası)","Göğsün sol kenarı"],"a":2,"c":"Eller göğüs kemiğinin alt yarısına, göğsün ortasına yerleştirilir."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Temel yaşam desteğine başlama kararı için sıradan bir ilk yardımcının esas alması gereken ölçüt aşağıdakilerden hangisidir?","o":["Yaralının bileğinden nabız alınamaması","Yaralının gözbebeklerinin büyük olması","Yaralının cildinin soluk görünmesi","Yaralının tepkisiz olması ve normal solunum yapmaması"],"a":3,"c":"Güncel uygulamada sıradan kişi nabız aramaz; tepkisiz ve normal solunumu olmayan kişiye TYD başlanır."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Bebek ve çocuklarda temel yaşam desteğine başlanırken göğüs basısından önce kaç kurtarıcı soluk verilir?","o":["1","2","5","10"],"a":2,"c":"Bebek ve çocuklarda solunum sorunu ön planda olduğundan önce 5 kurtarıcı soluk verilir."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Bebeklerde temel yaşam desteği uygulanırken göğüs yaklaşık kaç cm çöktürülmelidir?","o":["2","4","6","8"],"a":1,"c":"Bebekte göğüs ön-arka çapının yaklaşık üçte biri, yani yaklaşık 4 cm çöktürülür."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Çocuklarda temel yaşam desteği uygulanırken göğüs yaklaşık kaç cm çöktürülmelidir?","o":["3","5","7","9"],"a":1,"c":"Çocukta göğüs ön-arka çapının yaklaşık üçte biri, yani yaklaşık 5 cm çöktürülür."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Güncel uygulamaya göre bebeklerde göğüs basısı hangi teknikle yapılması önerilir?","o":["Göğsü iki elle sararak iki başparmakla","Tek elin topuğuyla","İki elin topuğu üst üste konarak","Yumrukla"],"a":0,"c":"Güncel kılavuzlar bebekte göğsü iki elle sarıp iki başparmakla bası yapılmasını önerir."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Bebeklerde kurtarıcı soluk verilirken aşağıdakilerden hangisi uygulanır?","o":["Bebeğin burnu kapatılarak yalnızca ağzına güçlü soluk verilir.","İlk yardımcının ağzı bebeğin hem ağzını hem burnunu kapatacak şekilde yerleştirilir.","Baş geriye tamamen bükülerek uzun ve sert soluk verilir.","Soluk verilmez, yalnızca sırtına vurulur."],"a":1,"c":"Bebekte ağızdan ağız-buruna yöntemi kullanılır; göğsü kaldıracak kadar yumuşak soluk verilir."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Başlanan temel yaşam desteği aşağıdaki durumlardan hangisinde sonlandırılabilir?","o":["İlk yardımcı birkaç bası sonra sonuç alamadığında","Yaralının yakınları olay yerine geldiğinde","Sağlık ekibi gelip uygulamayı devraldığında","Yaralının cildi morardığında"],"a":2,"c":"TYD; sağlık ekibi devralana, yaralı normal solumaya başlayana ya da ilk yardımcı güvenlik nedeniyle veya tükenene kadar sürdürülür."},{"d":"ilkyardim","k":"Temel yaşam desteği","q":"Tepkisiz bir yetişkinde görülen seyrek, hıçkırık benzeri, düzensiz nefes alma ile ilgili aşağıdakilerden hangisi doğrudur?","o":["Normal solunumdur; yaralı yalnız bırakılır.","Yaralı oturur pozisyona getirilir.","Yaralıya su içirilir.","Normal solunum kabul edilmez; temel yaşam desteğine başlanır."],"a":3,"c":"Bu tür \"can çekişme solunumu\" normal solunum değildir; kalp durması belirtisi sayılır ve TYD başlanır."},{"d":"ilkyardim","k":"Hava yolu tıkanıklığı","q":"Yemek yerken boğazına yiyecek kaçan bir yetişkin etkili şekilde öksürüyor ve konuşabiliyorsa ilk yardımcı ne yapmalıdır?","o":["Öksürmeye devam etmesi için cesaretlendirmeli ve izlemelidir.","Hemen karnına bası uygulamalıdır.","Parmağıyla boğazındaki cismi çıkarmaya çalışmalıdır.","Su içirerek cismi aşağı itmelidir."],"a":0,"c":"Kısmi tıkanmada öksürük en etkili yöntemdir; müdahale edilmez, kişi öksürmeye teşvik edilir."},{"d":"ilkyardim","k":"Hava yolu tıkanıklığı","q":"Bilinci açık, öksüremeyen ve konuşamayan yetişkinde hava yolu tıkanıklığına yapılan ilk yardım aşağıdakilerden hangisidir?","o":["Yaralı sırtüstü yatırılıp bacakları yükseltilir.","5 sırt vuruşu ve 5 karına bası dönüşümlü uygulanır.","Yaralıya hemen su içirilir.","Yaralı koma pozisyonuna getirilir."],"a":1,"c":"Tam tıkanmada kürek kemikleri arasına 5 sırt vuruşu ve 5 karına bası (Heimlich) dönüşümlü yapılır."},{"d":"ilkyardim","k":"Hava yolu tıkanıklığı","q":"Heimlich manevrasında ilk yardımcı yumruğunu nereye yerleştirmelidir?","o":["Göğüs kemiğinin tam ortasına","Kasık bölgesine","Göbeğin biraz üstüne, göğüs kemiğinin altına","Sırtın ortasına"],"a":2,"c":"Yumruk göbek ile göğüs kemiğinin alt ucu arasına konur ve içe-yukarı doğru bastırılır."},{"d":"ilkyardim","k":"Hava yolu tıkanıklığı","q":"Bebeklerde tam hava yolu tıkanıklığında aşağıdaki uygulamalardan hangisi yapılmaz?","o":["Yüzüstü kol üzerinde sırta vuruş","Sırtüstü çevrilerek göğüs basısı","Ağız içindeki görünen cismin alınması","Karına bası (Heimlich)"],"a":3,"c":"Bebeklerde karın organları zarar görebileceği için karına bası yapılmaz; sırt vuruşu ve göğüs basısı uygulanır."},{"d":"ilkyardim","k":"Hava yolu tıkanıklığı","q":"I. Bebek yüzüstü, başı gövdesinden aşağıda olacak şekilde ilk yardımcının kolu üzerine yatırılır.\nII. Kürek kemikleri arasına 5 kez sırt vuruşu yapılır.\nIII. Bebek sırtüstü çevrilerek 5 kez göğüs basısı uygulanır.\nBilinci açık bebekte tam hava yolu tıkanıklığında verilenlerden hangileri uygulanır?","o":["Yalnız I","I ve II","II ve III","I, II ve III"],"a":3,"c":"Bebekte başı aşağıda olacak şekilde 5 sırt vuruşu ve ardından 5 göğüs basısı dönüşümlü yapılır."},{"d":"ilkyardim","k":"Kanamalar","q":"Açık kırmızı renkte olan ve kalp atımlarıyla uyumlu olarak fışkırır tarzda akan kanama hangi damardan kaynaklanır?","o":["Atardamar","Toplardamar","Kılcal damar","Lenf damarı"],"a":0,"c":"Atardamar kanaması açık kırmızı ve fışkırır tarzdadır; en tehlikeli dış kanama türüdür."},{"d":"ilkyardim","k":"Kanamalar","q":"Dış kanamalarda ilk yardımcının **ilk** uygulaması gereken yöntem aşağıdakilerden hangisidir?","o":["Turnike uygulamak","Kanayan yere temiz bir bezle doğrudan baskı yapmak","Basınç noktasına bastırmak","Yaralıya sıvı içirmek"],"a":1,"c":"Dış kanamada ilk olarak yaranın üzerine doğrudan baskı uygulanır; turnike son çaredir."},{"d":"ilkyardim","k":"Kanamalar","q":"Bacaktaki şiddetli kanamayı durdurmak için basınç uygulanacak nokta aşağıdakilerden hangisidir?","o":["Şah damarı","Köprücük kemiği arkası","Kasık","Şakak"],"a":2,"c":"Bacak kanamalarında kasıkta uyluk atardamarına baskı uygulanır."},{"d":"ilkyardim","k":"Kanamalar","q":"Koldaki ve omuzdaki kanamalarda hangi basınç noktasına bastırılır?","o":["Kasık","Diz arkası","Ayak bileği","Köprücük kemiğinin arkası"],"a":3,"c":"Kol ve omuz kanamalarında köprücük kemiği arkasındaki atardamara baskı uygulanır."},{"d":"ilkyardim","k":"Kanamalar","q":"Turnike uygulamasıyla ilgili aşağıdakilerden hangisi **yanlıştır**?","o":["Turnike için ip veya tel gibi ince malzemeler kullanılabilir.","Turnikenin uygulandığı saat not edilir.","Turnike tek kemikli bölgeye uygulanır.","Turnike, kol veya bacak kopmalarında uygulanabilir."],"a":0,"c":"İp, tel gibi ince ve kesici malzemeler dokulara zarar verir; geniş bir bez veya hazır turnike kullanılır."},{"d":"ilkyardim","k":"Kanamalar","q":"I. Kol ya da bacakta kopma olması\nII. Doğrudan baskıyla durdurulamayan şiddetli uzuv kanaması\nIII. Kılcal damardan sızıntı tarzında kanama\nVerilenlerden hangilerinde turnike uygulanabilir?","o":["Yalnız I","I ve II","II ve III","I, II ve III"],"a":1,"c":"Turnike kopmalarda ve doğrudan baskıyla durmayan uzuv kanamalarında uygulanır; kılcal kanamada gerekmez."},{"d":"ilkyardim","k":"Kanamalar","q":"Burun kanaması olan bilinci açık kişiye yapılan ilk yardımla ilgili aşağıdakilerden hangisi doğrudur?","o":["Kişinin başı geriye doğru yatırılır.","Kişi oturtulur, başı hafifçe öne eğilir ve burun kanatları sıkıştırılır.","Kişi sırtüstü yatırılıp bacakları kaldırılır.","Kişiye sık sık sümkürmesi söylenir."],"a":1,"c":"Baş geriye yatırılırsa kan yutulur; baş öne eğik tutularak burun kanatları sıkılır."},{"d":"ilkyardim","k":"Kanamalar","q":"Aşağıdakilerden hangisi iç kanama belirtilerinden biri **değildir**?","o":["Hızlı ve zayıf nabız","Soğuk, nemli ve soluk cilt","Yüzün kızarık, cildin sıcak ve kuru olması","Aşırı susuzluk hissi"],"a":2,"c":"İç kanamada şok bulguları görülür: soluk, soğuk-nemli cilt, hızlı-zayıf nabız ve susuzluk."},{"d":"ilkyardim","k":"Kanamalar","q":"Kulağından kan gelen yaralıya ilk yardımda aşağıdakilerden hangisi yapılmamalıdır?","o":["Yaralının hareket ettirilmemesi","112'nin aranması","Yaşamsal bulguların izlenmesi","Kulağın pamukla tıkanması"],"a":3,"c":"Kulaktan gelen kan kafa tabanı kırığı belirtisi olabilir; kulak tıkanmaz, akışına izin verilir."},{"d":"ilkyardim","k":"Kanamalar","q":"Turnike uygulanan yaralıyla ilgili aşağıdakilerden hangisi yapılmalıdır?","o":["Uygulama saati yazılarak sağlık ekibine bildirilmeli ve turnikenin üstü açık bırakılmalıdır.","Turnikenin üzeri battaniyeyle örtülerek gizlenmelidir.","Turnike ilk yardımcı tarafından sık sık çıkarılıp yeniden takılmalıdır.","Turnike kanama durunca hemen tamamen çıkarılmalıdır."],"a":0,"c":"Turnike saati not edilip ekibe bildirilir ve turnike görünür bırakılır; ilk yardımcı tarafından gevşetilmez."},{"d":"ilkyardim","k":"Şok","q":"Dolaşım sisteminin yetersizliği nedeniyle dokulara yeterli kan gitmemesi sonucu ortaya çıkan, hayatı tehdit eden duruma ne ad verilir?","o":["Bayılma","Şok","Havale","Sıcak çarpması"],"a":1,"c":"Şok, hayati organlara yeterli kan ve oksijen gitmemesiyle oluşan ciddi bir tablodur."},{"d":"ilkyardim","k":"Şok","q":"Aşağıdakilerden hangisi şok belirtilerinden biridir?","o":["Yavaş ve dolgun nabız","Kızarık ve sıcak cilt","Soğuk, nemli ve soluk cilt","Derin ve yavaş solunum"],"a":2,"c":"Şokta cilt soğuk, nemli ve soluk; nabız hızlı ve zayıf, solunum hızlı ve yüzeyseldir."},{"d":"ilkyardim","k":"Şok","q":"Bilinci açık, bacak ve omurga yaralanması olmayan şoktaki yaralıya hangi pozisyon verilir?","o":["Yüzüstü yatırılır.","Oturur pozisyonda başı öne eğilir.","Ayakta tutulup yürütülür.","Sırtüstü yatırılıp bacakları yaklaşık 30 cm yükseltilir."],"a":3,"c":"Şok pozisyonunda yaralı sırtüstü yatırılır ve bacakları yaklaşık 30 cm yükseltilerek kanın hayati organlara dönüşü desteklenir."},{"d":"ilkyardim","k":"Şok","q":"Şoktaki yaralıya yapılacak ilk yardımla ilgili aşağıdakilerden hangisi **yanlıştır**?","o":["Susadığını söylerse bol su içirilir.","Üzeri örtülerek ısı kaybı önlenir.","Sıkan giysileri gevşetilir.","Yaşamsal bulguları sık sık kontrol edilir."],"a":0,"c":"Şoktaki yaralıya ağızdan hiçbir şey verilmez; ameliyat gerekebilir ve kusma riski vardır."},{"d":"ilkyardim","k":"Şok","q":"I. Ciddi kan kaybı\nII. Ağır yanıklar\nIII. Şiddetli alerjik tepki\nVerilenlerden hangileri şoka neden olabilir?","o":["Yalnız I","I ve II","II ve III","I, II ve III"],"a":3,"c":"Kan kaybı, yanıkla sıvı kaybı ve şiddetli alerjik tepki şoka yol açabilir."},{"d":"ilkyardim","k":"Yaralanmalar (kafa, omurga, göğüs, karın)","q":"Kulak ve burundan kan ya da açık renkli sıvı gelmesi ve göz çevresinde morluk görülmesi hangi yaralanmayı düşündürür?","o":["Köprücük kemiği kırığı","Kafa tabanı kırığı","Kaburga kırığı","Leğen kemiği kırığı"],"a":1,"c":"Kulak-burundan kan veya sıvı gelmesi ve göz çevresi morluğu kafa tabanı kırığı belirtisidir."},{"d":"ilkyardim","k":"Yaralanmalar (kafa, omurga, göğüs, karın)","q":"Omurga yaralanması şüphesi olan kazazedeye yaklaşımda aşağıdakilerden hangisi doğrudur?","o":["Oturtularak ağrısı olup olmadığı sorulmalıdır.","Başı öne eğilerek hava yolu açılmalıdır.","Baş-boyun-gövde ekseni korunarak hareket ettirilmemelidir.","Yürüyüp yürüyemediği denenmelidir."],"a":2,"c":"Omurga yaralısı gereksiz hareket ettirilmez; baş-boyun-gövde ekseni bozulmamalıdır."},{"d":"ilkyardim","k":"Yaralanmalar (kafa, omurga, göğüs, karın)","q":"Göğsüne delici cisim batmış ve cisim hâlâ yerinde duran yaralıya yapılacak uygulama aşağıdakilerden hangisidir?","o":["Cisim hemen çekilerek çıkarılır.","Cisim çıkarılıp yaraya pamuk bastırılır.","Cisim kırılarak kısaltılır ve yaralı yürütülür.","Cisim çıkarılmadan etrafı desteklenerek sabitlenir."],"a":3,"c":"Batan cisim çıkarılırsa ağır kanama olabilir; çıkarılmaz, sabitlenir."},{"d":"ilkyardim","k":"Yaralanmalar (kafa, omurga, göğüs, karın)","q":"Göğsünde delici yaralanma bulunan bilinci açık bir yaralıya hangi pozisyon verilmelidir?","o":["Yarı oturur pozisyon","Sırtüstü yatıp bacakları yükseltilmiş pozisyon","Yüzüstü pozisyon","Baş aşağı pozisyon"],"a":0,"c":"Delici göğüs yaralanmasında solunumu kolaylaştırmak için yarı oturur pozisyon verilir; bacaklar yükseltilmez."},{"d":"ilkyardim","k":"Yaralanmalar (kafa, omurga, göğüs, karın)","q":"Karın yaralanmasında iç organlar dışarı çıkmışsa ilk yardımcı ne yapmalıdır?","o":["Organları elle karın içine geri itmelidir.","Organların üzerini nemli, temiz bir bezle örtmelidir.","Yaraya toz antibiyotik dökmelidir.","Yaralıya bol su içirmelidir."],"a":1,"c":"Dışarı çıkan organlar içeri sokulmaz; üzeri nemli temiz bezle örtülür, yaralıya bir şey içirilmez."},{"d":"ilkyardim","k":"Yaralanmalar (kafa, omurga, göğüs, karın)","q":"Kafa travması geçiren bir kişide aşağıdakilerden hangisi tehlike belirtisi olarak değerlendirilmelidir?","o":["Hafif kızarıklık","Kısa süreli heyecan","Bilinç düzeyinde giderek azalma ve tekrarlayan kusma","Ellerde sıcaklık hissi"],"a":2,"c":"Kafa travması sonrası bilincin bulanması ve kusma beyin hasarını düşündürür; kişi yakından izlenir ve 112 aranır."},{"d":"ilkyardim","k":"Yaralanmalar (kafa, omurga, göğüs, karın)","q":"I. Yaralının boynunu sabit tutmak\nII. Yaralıyı tek kişiyle kucakta taşımak\nIII. Yaralıyı sırt tahtası veya sert sedye ile taşımak\nOmurga yaralanması şüphesinde verilenlerden hangileri doğru uygulamalardır?","o":["Yalnız II","I ve III","II ve III","I, II ve III"],"a":1,"c":"Boyun sabitlenir ve sert sedyeyle taşınır; kucakta taşımak omuriliğe zarar verebilir."},{"d":"ilkyardim","k":"Kırık, çıkık ve burkulma","q":"Aşağıdakilerden hangisi kırık belirtilerinden biri **değildir**?","o":["Şekil bozukluğu","Şişlik ve morluk","Hareket kaybı","Bölgede hiçbir ağrı olmaması"],"a":3,"c":"Kırıkta ağrı, şekil bozukluğu, şişlik-morluk ve hareket kaybı görülür."},{"d":"ilkyardim","k":"Kırık, çıkık ve burkulma","q":"Kırık tespiti yapılırken aşağıdakilerden hangisine dikkat edilmelidir?","o":["Kırık bölgesinin bir üst ve bir alt eklemi de içine alınmalıdır.","Yalnızca kırık bölgesi sıkıca sarılmalıdır.","Kırık kemik önce yerine oturtulmalıdır.","Tespit malzemesi doğrudan çıplak cilde sert biçimde bağlanmalıdır."],"a":0,"c":"Tespit, kırığın bir üst ve bir alt eklemini kapsamalı; atel ile cilt arası yumuşak malzemeyle desteklenmelidir."},{"d":"ilkyardim","k":"Kırık, çıkık ve burkulma","q":"Açık kırığa yapılan ilk yardımla ilgili aşağıdakilerden hangisi doğrudur?","o":["Dışarı çıkan kemik ucu yerine itilir.","Yaranın üzeri temiz bezle kapatılır, kemik uçları içeri itilmez.","Yara sıkıca dikilir.","Kırık bölge sıcak suyla yıkanır."],"a":1,"c":"Açık kırıkta yara temiz bir örtüyle kapatılır, kemik içeri itilmez ve bulunduğu şekilde tespit edilir."},{"d":"ilkyardim","k":"Kırık, çıkık ve burkulma","q":"Çıkığa yapılan ilk yardımla ilgili aşağıdakilerden hangisi doğrudur?","o":["Hemen çekilerek yerine oturtulur.","Bölge sıcak bezle ovulur.","Bulunduğu şekilde tespit edilir, yerine oturtulmaya çalışılmaz.","Yaralıdan eklemi hareket ettirmesi istenir."],"a":2,"c":"Çıkık yerine oturtulmaya çalışılırsa damar-sinir hasarı oluşabilir; olduğu gibi tespit edilir."},{"d":"ilkyardim","k":"Kırık, çıkık ve burkulma","q":"Ayak bileği burkulan kişiye yapılacak ilk yardım aşağıdakilerden hangisidir?","o":["Sıcak uygulama yapılıp masaj yapılır.","Ayağın üzerine basarak yürümesi istenir.","Bilek çekilerek yerine oturtulur.","Soğuk uygulama yapılır, bandajla sarılır ve ayak yükseltilir."],"a":3,"c":"Burkulmada soğuk uygulama, bandajla destek ve yükseltme şişliği ve ağrıyı azaltır."},{"d":"ilkyardim","k":"Kırık, çıkık ve burkulma","q":"Ön kol kırığı tespit edildikten sonra kolun desteklenmesi için genellikle aşağıdakilerden hangisi kullanılır?","o":["Üçgen sargı ile kol askısı","Turnike","Boyunluk","Elastik çorap"],"a":0,"c":"Ön kol kırığı tespit edildikten sonra üçgen sargıyla kol askıya alınır."},{"d":"ilkyardim","k":"Yanık, donma ve sıcak çarpması","q":"Isı ile oluşan yanıklarda yanan bölgeye ilk olarak ne yapılmalıdır?","o":["Üzerine yağ veya diş macunu sürülmelidir.","En az 20 dakika tazyiksiz, serin suyla soğutulmalıdır.","Buz doğrudan yanık üzerine konulmalıdır.","Oluşan su kabarcıkları patlatılmalıdır."],"a":1,"c":"Yanık bölgesi en az 20 dakika tazyiksiz serin suyla soğutulur; yağ, macun ve buz uygulanmaz."},{"d":"ilkyardim","k":"Yanık, donma ve sıcak çarpması","q":"Yanıklarda aşağıdaki uygulamalardan hangisi **yanlıştır**?","o":["Yüzük, saat gibi takılar şişmeden çıkarılır.","Yanık temiz ve nemli bir bezle örtülür.","Yanık bölgesine yapışan giysiler çekilerek çıkarılır.","Su kabarcıkları patlatılmaz."],"a":2,"c":"Yapışan giysiler çekilirse doku hasarı artar; yapışmış giysiler çıkarılmaz."},{"d":"ilkyardim","k":"Yanık, donma ve sıcak çarpması","q":"Kimyasal madde sıçrayan göze yapılacak ilk yardım aşağıdakilerden hangisidir?","o":["Göz ovularak kimyasal madde çıkarılmalıdır.","Göze göz damlası damlatılmalıdır.","Göz kapatılarak hiçbir işlem yapılmamalıdır.","Göz bol miktarda temiz suyla uzun süre yıkanmalıdır."],"a":3,"c":"Kimyasal temasında göz, içten dışa doğru bol suyla uzun süre yıkanır ve sağlık kuruluşuna başvurulur."},{"d":"ilkyardim","k":"Yanık, donma ve sıcak çarpması","q":"Donma olan bölgeye yapılacak ilk yardımla ilgili aşağıdakilerden hangisi doğrudur?","o":["Kişi ılık bir ortama alınır, donmuş bölge ovuşturulmadan yavaşça ısıtılır.","Donmuş bölge karla ovulur.","Donmuş bölge ateşe doğrudan yaklaştırılır.","Isınması için kişiye alkollü içecek verilir."],"a":0,"c":"Donmada bölge ovuşturulmaz ve doğrudan ateşe tutulmaz; kişi ılık ortamda yavaşça ısıtılır, alkol verilmez."},{"d":"ilkyardim","k":"Yanık, donma ve sıcak çarpması","q":"Sıcak çarpması geçiren kişiye yapılacak ilk yardım aşağıdakilerden hangisidir?","o":["Kalın bir battaniyeyle sıkıca örtülür.","Serin bir yere alınır, giysileri gevşetilir ve ıslak bezlerle vücudu soğutulur.","Güneş altında dinlendirilir.","Sıcak içecek verilir."],"a":1,"c":"Sıcak çarpmasında amaç vücut ısısını düşürmektir; kişi serin ortama alınır ve ıslak bezlerle soğutulur."},{"d":"ilkyardim","k":"Zehirlenmeler","q":"Kapalı bir ortamda karbonmonoksit zehirlenmesi yaşayan kişiye ilk yardımda **öncelikle** yapılması gereken nedir?","o":["Kişiye süt içirmek","Kişiyi kusturmak","Kendi güvenliğini sağlayarak kişiyi temiz havaya çıkarmak","Ortamda ışık yakmak için kibrit çakmak"],"a":2,"c":"Önce ortam havalandırılır ve kişi temiz havaya çıkarılır; gaz ortamında kıvılcım oluşturulmaz."},{"d":"ilkyardim","k":"Zehirlenmeler","q":"Çamaşır suyu gibi yakıcı bir madde içen bilinci açık kişiye yapılan ilk yardımda aşağıdakilerden hangisi yapılmamalıdır?","o":["112'nin aranması","İçilen maddenin ambalajının saklanması","Kişinin yaşamsal bulgularının izlenmesi","Kişinin kusturulması"],"a":3,"c":"Yakıcı madde kusturulursa yemek borusu ve ağız ikinci kez yanar; kusturulmaz."},{"d":"ilkyardim","k":"Zehirlenmeler","q":"Zehirlenmelerde ilk yardımla ilgili aşağıdakilerden hangisi doğrudur?","o":["Zehirlenmeye neden olan maddenin ne olduğu öğrenilerek sağlık ekibine bildirilir.","Her zehirlenmede kişi mutlaka kusturulur.","Bilinci kapalı kişiye ağızdan sıvı verilir.","Zehirlenen kişi yalnız bırakılır."],"a":0,"c":"Zehrin türü, miktarı ve alınma zamanı öğrenilip sağlık ekibine bildirilmelidir."},{"d":"ilkyardim","k":"Zehirlenmeler","q":"I. Sindirim yoluyla\nII. Solunum yoluyla\nIII. Deri yoluyla\nZehirler vücuda verilenlerden hangileri ile girebilir?","o":["Yalnız I","I ve II","II ve III","I, II ve III"],"a":3,"c":"Zehirler sindirim, solunum, deri ve iğne-sokma yoluyla vücuda girebilir."},{"d":"ilkyardim","k":"Hayvan ısırıkları ve sokmaları","q":"Köpek ısırması sonucu oluşan yaraya yapılacak ilk yardım aşağıdakilerden hangisidir?","o":["Yaranın üzerine kolonya döküp sıkıca dikilir.","Yara bol sabunlu suyla yıkanır ve kişi kuduz riski nedeniyle sağlık kuruluşuna yönlendirilir.","Yara hiç temizlenmeden sıkıca kapatılır.","Hayvanın sahibi bulunana kadar yaralıya dokunulmaz."],"a":1,"c":"Isırık yarası sabunlu suyla yıkanır; kuduz ve tetanos riski nedeniyle sağlık kurul ğı yanınca egzozdan mavimsi duman çıkar."},{"d":"motor","k":"Arıza belirtileri","q":"Egzozdan yoğun siyah duman çıkması neyi gösterir?","o":["Soğutma suyunun fazla olduğunu","Motorun yağ yaktığını","Yakıtın tam yanmadığını","Fren hidroliğinin azaldığını"],"a":2,"c":"Siyah duman, fazla yakıt ya da yetersiz hava nedeniyle yanmanın eksik olduğunu gösterir."},{"d":"motor","k":"Arıza belirtileri","q":"Motor çalışma sıcaklığına ulaştıktan sonra da egzozdan sürekli ve yoğun beyaz duman çıkması neyi gösterir?","o":["Akünün fazla şarj olduğunu","Yakıtın tam yandığını","Hava filtresinin yeni olduğunu","Yanma odasına soğutma suyu karıştığını"],"a":3,"c":"Silindir kapak contası gibi arızalarda soğutma suyu yanma odasına sızar ve buhar hâlinde beyaz duman çıkar."},{"d":"motor","k":"Arıza belirtileri","q":"Aşağıdakilerden hangisi motorun derhal durdurulmasını gerektirir?","o":["Seyir hâlinde yağ basıncı ikaz ışığının yanması","Sinyal göstergesinin yanıp sönmesi","Kısa far gösterge ışığının yanması","Yakıt göstergesinin yarım depoyu göstermesi"],"a":0,"c":"Yağ basıncı ikazı yanarken çalışmaya devam eden motor kısa sürede ağır hasar görür."},{"d":"motor","k":"Aydınlatma ve sinyal","q":"Geri vites lambasının rengi aşağıdakilerden hangisidir?","o":["Kırmızı","Beyaz","Sarı","Mavi"],"a":1,"c":"Geri vites lambası beyaz ışık verir ve araç geri vitese takıldığında yanar."},{"d":"motor","k":"Aydınlatma ve sinyal","q":"Bir taraftaki sinyal lambalarının normalden çok daha hızlı yanıp sönmesi genellikle neyi gösterir?","o":["Farların ayarının bozuk olduğunu","Akünün tam dolu olduğunu","O taraftaki sinyal ampullerinden birinin yandığını","Fren lambalarının çalıştığını"],"a":2,"c":"Sinyal devresinde bir ampul yanınca devre direnci değişir ve sinyal hızlı yanıp söner."},{"d":"motor","k":"Aydınlatma ve sinyal","q":"Dörtlü flaşörler (acil uyarı ışıkları) hangi durumda kullanılmalıdır?","o":["Öndeki aracı geçerken","Kavşaklarda geçiş üstünlüğü sağlamak için","Duraklama yasağı olan yerde beklerken","Arıza veya kaza nedeniyle taşıt yolunda durmak zorunda kalındığında"],"a":3,"c":"Dörtlü flaşörler, tehlike oluşturan durumlarda diğer sürücüleri uyarmak için kullanılır."},{"d":"motor","k":"Güvenlik donanımları","q":"Hava yastığının koruyucu etkisini tam gösterebilmesi için aşağıdakilerden hangisi gereklidir?","o":["Emniyet kemerinin takılı olması","Koltuğun direksiyona olabildiğince yakın olması","Ön koltukta çocuk taşınması","Camların açık olması"],"a":0,"c":"Hava yastığı kemeri tamamlayan bir sistemdir; kemersiz yolcu yastığa savrularak yaralanabilir."},{"d":"motor","k":"Güvenlik donanımları","q":"Aşağıdakilerden hangisi pasif güvenlik donanımıdır?","o":["ABS","Hava yastığı","ESP","ASR"],"a":1,"c":"Pasif güvenlik kaza anında yaralanmayı azaltır (hava yastığı, kemer); ABS, ESP ve ASR kazayı önlemeye yönelik aktif sistemlerdir."},{"d":"motor","k":"Güvenlik donanımları","q":"Ön yolcu hava yastığı devredeyken bu koltuğa sırtı yola dönük bebek koltuğu takılması neden tehlikelidir?","o":["Sürücünün ayna görüşünü kapattığı için","Bebek koltuğu kemerle bağlanamadığı için","Hava yastığı açıldığında bebeğe ağır zarar verebileceği için","Hava yastığının açılmasını engellediği için"],"a":2,"c":"Açılan hava yastığı bebek koltuğuna büyük bir kuvvetle çarpar; bu durumda yastık devre dışı bırakılmalıdır."},{"d":"motor","k":"Ekonomik sürüş","q":"Aşağıdakilerden hangisi yakıt tasarrufu sağlar?","o":["Uygun viteste sabit hızla gitmek","Ani kalkış ve frenler yapmak","Lastik basıncını düşük tutmak","Bagajda gereksiz yük taşımak"],"a":0,"c":"Sabit hız ve uygun vites motoru verimli devirde çalıştırır; ani hızlanmalar yakıt tüketimini artırır."},{"d":"motor","k":"Ekonomik sürüş","q":"Aşağıdakilerden hangisi yakıt tüketimini artıran durumlardan biri **değildir**?","o":["Lastik hava basıncının düşük olması","Hava filtresinin kirli olması","Periyodik bakımın zamanında yaptırılması","Motorun uzun süre rölantide çalıştırılması"],"a":2,"c":"Zamanında yapılan bakım motorun verimli çalışmasını sağlar ve tüketimi azaltır."},{"d":"motor","k":"Ekonomik sürüş","q":"I. Uzun süre rölantide beklememek\nII. Trafiği önceden gözleyip ani fren yapmamak\nIII. Vitesleri her zaman yüksek devirde değiştirmek\nEkonomik sürüş için yukarıdakilerden hangileri doğrudur?","o":["Yalnız I","I ve II","II ve III","I, II ve III"],"a":1,"c":"Gereksiz rölanti ve ani frenden kaçınmak yakıt tasarrufu sağlar; yüksek devirde vites değiştirmek tüketimi artırır."},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Öndeki taşıtı geçmek yasaktır","İki yönlü trafik","Karşıdan gelene yol ver","Taşıt trafiğine kapalı yol"],"a":0,"c":"Kırmızı kenarlı dairede biri kırmızı iki otomobil bulunan işaret “Öndeki taşıtı geçmek yasaktır” işaretidir.","g":"y-sollama"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işaretin bulunduğu yol kesiminde aşağıdakilerden hangisi yasaktır?","o":["Sağ şeritten yola devam etmek","Hızı azaltmak","Motorlu taşıtla öndeki taşıtı geçmek","Kısa far kullanmak"],"a":2,"c":"“Öndeki taşıtı geçmek yasaktır” işareti, yasağın sonu belirtilinceye kadar geçme yapılamayacağını bildirir.","g":"y-sollama"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Kamyon giremez","Yük taşıtlarının öndeki taşıtı geçmesi yasaktır","Otomobillerin kamyonları geçmesi yasaktır","Kamyonlar için geçme yasağı sonu"],"a":1,"c":"Kırmızı kamyon ve siyah otomobil bulunan işaret “Yük taşıtlarının öndeki taşıtı geçmesi yasaktır” işaretidir.","g":"y-kamyon-gecme"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işaretin bulunduğu yolda aşağıdakilerden hangisi doğrudur?","o":["Otomobil sürücüsü öndeki kamyonu geçemez.","Kamyonların bu yola girmesi yasaktır.","Kamyonlar yalnızca sol şeridi kullanabilir.","Kamyon sürücüsü öndeki taşıtı geçemez."],"a":3,"c":"“Yük taşıtlarının öndeki taşıtı geçmesi yasaktır” işareti yalnız yük taşıtlarına geçme yasağı getirir; otomobiller kurallara uyarak geçebilir.","g":"y-kamyon-gecme"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Yük taşıtlarının öndeki taşıtı geçmesi yasaktır","Bütün yasaklama ve kısıtlamaların sonu","Kamyon giremez yasağının sonu","Kamyonlar için geçme yasağı sonu"],"a":3,"c":"Gri renkli ve çapraz çizgili kamyon-otomobil sembolü “Kamyonlar için geçme yasağı sonu” anlamındadır.","g":"y-kamyon-gecme-sonu"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Öndeki taşıtı geçmek yasaktır","Geçme yasağı sonu","Hız sınırlaması sonu","Taşıt trafiğine kapalı yol"],"a":1,"c":"Gri iki otomobilin üzerinde çapraz çizgiler bulunan işaret “Geçme yasağı sonu” işaretidir.","g":"y-sollama-sonu"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Okul geçidi","Yaya geçidi","Yaya giremez","Yaya yolu"],"a":0,"c":"Üçgen içinde iki çocuk bulunan işaret “Okul geçidi” tehlike uyarı işaretidir.","g":"t-okul-gecidi"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işareti gören sürücü aşağıdakilerden hangisini yapmalıdır?","o":["Geçidi hızla geçmek için öndeki aracı geçmelidir.","Sesli işaret vererek çocukları uyarmalı ve hızını korumalıdır.","Hızını azaltıp okul çocuklarına karşı dikkatli olmalıdır.","Geçidin üzerinde park etmelidir."],"a":2,"c":"“Okul geçidi” işaretine yaklaşırken yavaşlanır; geçitte ve geçide yaklaşırken geçme yapılmaz, duraklanmaz.","g":"t-okul-gecidi"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işaretle karşılaşan sürücü aşağıdakilerden hangisini yapmalıdır?","o":["Geçiş hakkı kendisinde olduğundan hızını korumalıdır.","Ana yoldaki araçlara yol vermeli, gerekiyorsa durmalıdır.","Sadece sağdan gelen araçlara yol vermelidir.","Kavşağa girip ortasında beklemelidir."],"a":1,"c":"“Yol ver” işaretini gören sürücü ana yoldaki trafiğe yol verir, gerekiyorsa durur; trafik uygunsa durmadan da geçebilir.","g":"yol-ver"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Önceliği olan yön (karşıdan gelene göre)","İki yönlü trafik","Tek yönlü yol","Karşıdan gelene yol ver"],"a":3,"c":"Kırmızı kenarlı dairede zıt yönlü iki ok bulunan işaret “Karşıdan gelene yol ver” işaretidir.","g":"y-karsidan-gelene"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işaretin bulunduğu dar köprüye yaklaşan sürücü aşağıdakilerden hangisini yapmalıdır?","o":["Karşıdan gelen aracı ışıkla uyarıp önce geçmelidir.","Köprüye karşıdan gelenlerden önce girmek için hızlanmalıdır.","Karşı yönden gelen araç geçinceye kadar beklemelidir.","Köprü üzerinde duraklayıp karşıdan geleni beklemelidir."],"a":2,"c":"“Karşıdan gelene yol ver” işareti olan yerde geçiş önceliği karşı yönden gelenlerindir.","g":"y-karsidan-gelene"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Girişi olmayan yol","Taşıt trafiğine kapalı yol","Duraklamak ve park etmek yasaktır","Bütün yasaklama ve kısıtlamaların sonu"],"a":0,"c":"Kırmızı daire içinde beyaz yatay bant bulunan işaret “Girişi olmayan yol” işaretidir.","g":"y-girilmez"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işaretin bulunduğu yol için aşağıdakilerden hangisi doğrudur?","o":["Bu yolda yalnızca park etmek yasaktır.","Bu yolda yalnızca kamyonların geçmesi yasaktır.","Bu yola işaretin bulunduğu yönden taşıtla girilemez.","Bu yolda azami hız sınırı sona ermektedir."],"a":2,"c":"“Girişi olmayan yol” işareti genellikle tek yönlü yolların çıkışına konur ve o yönden girişi yasaklar.","g":"y-girilmez"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Yüksekliği 3,50 metreden fazla olan taşıt giremez","Genişliği 3,50 metreden fazla olan taşıt giremez","Uzunluğu 3,50 metreden fazla olan taşıt giremez","Azami ağırlığı 3,5 tondan fazla olan taşıt giremez"],"a":0,"c":"Uçları birbirine bakan dikey oklar yükseklik (gabari) sınırlamasını gösterir: “Yüksekliği 3,50 metreden fazla olan taşıt giremez”.","g":"y-gabari"},{"d":"trafik","k":"Trafik işaretleri","q":"Yüksekliği 4 metre olan bir kamyonun sürücüsü şekildeki işaretle karşılaşırsa ne yapmalıdır?","o":["Hızını azaltarak yola girebilir.","Sadece gündüz saatlerinde girebilir.","Sol şeridi kullanarak girebilir.","Bu yola girmemeli, başka güzergâh kullanmalıdır."],"a":3,"c":"“Yüksekliği 3,50 metreden fazla olan taşıt giremez” işareti bu sınırı aşan taşıtların yola girmesini yasaklar.","g":"y-gabari"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Girişi olmayan yol","Bütün yasaklama ve kısıtlamaların sonu","Taşıt trafiğine kapalı yol","Park etmek yasaktır"],"a":1,"c":"Beyaz daire üzerinde çapraz çizgi bulunan işaret, daha önce konulmuş bütün yasaklama ve kısıtlamaların sona erdiğini bildirir.","g":"y-tum-yasak-sonu"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Hız sınırlaması sonu (50 km/saat)","Azami hız sınırlaması (50 km/saat)","Asgari hız sınırlaması (50 km/saat)","Bütün yasaklama ve kısıtlamaların sonu"],"a":0,"c":"Gri rakam üzerinde çapraz çizgiler bulunan işaret “Hız sınırlaması sonu” işaretidir.","g":"y-hiz-sonu"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Vahşi hayvanlar geçebilir","Hayvanların giremeyeceği yol","Ehli hayvanlar geçebilir","Hayvanla çekilen taşıt giremez"],"a":2,"c":"Üçgen içinde inek sembolü bulunan işaret “Ehli hayvanlar geçebilir” tehlike uyarı işaretidir.","g":"t-evcil-hayvan"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Kaygan yol","Gizli buzlanma","Yandan rüzgâr","Gevşek malzemeli zemin"],"a":1,"c":"Üçgen içinde kar tanesi bulunan işaret “Gizli buzlanma” işaretidir.","g":"t-gizli-buzlanma"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işaretin bulunduğu yolda soğuk havada aşağıdakilerden hangisi yapılmalıdır?","o":["Yol kuru göründüğünden normal hızla devam edilmelidir.","Tutunmayı artırmak için hız artırılmalıdır.","Sık sık ani fren yapılarak yol kontrol edilmelidir.","Hız azaltılmalı, ani fren ve ani direksiyon hareketlerinden kaçınılmalıdır."],"a":3,"c":"“Gizli buzlanma” işareti, gözle görülmeyen buzlanma olabileceğini bildirir; yavaş ve yumuşak sürülmelidir.","g":"t-gizli-buzlanma"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Kontrollü demiryolu geçidi","Tramvay hattı","Yolda çalışma","Kontrolsüz demiryolu geçidi"],"a":3,"c":"Üçgen içinde lokomotif bulunan işaret bariyersiz “Kontrolsüz demiryolu geçidi” işaretidir.","g":"t-demiryolu-kontrolsuz"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işaretin bulunduğu yerde aşağıdakilerden hangisi yapılmalıdır?","o":["Bariyer olmadığından hız azaltılmadan geçilmelidir.","Geçide yaklaşırken yavaşlanmalı, durup tren gelmediğinden emin olduktan sonra geçilmelidir.","Geçide yaklaşırken öndeki taşıt geçilmelidir.","Geçit üzerinde durularak tren beklenmelidir."],"a":1,"c":"“Kontrolsüz demiryolu geçidi”nde sürücü uygun mesafede durur, tren gelmediğinden emin olunca geçer; geçitte ve geçide yaklaşırken geçme yapılmaz.","g":"t-demiryolu-kontrolsuz"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Tehlikeli eğim (iniş)","Tehlikeli eğim (çıkış)","Deniz veya nehir kıyısında biten yol","Kasisli yol"],"a":0,"c":"Yüzde değeri ve aşağı inen eğim çizilen üçgen “Tehlikeli eğim (iniş)” işaretidir.","g":"t-egim-inis"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki işaretin bulunduğu yolda aşağıdakilerden hangisi doğru bir davranıştır?","o":["Vitesi boşa alıp inmek","Sürekli fren pedalına basarak inmek","Küçük vitese geçip motor freninden yararlanmak","Hızı artırıp öndeki taşıtı geçmek"],"a":2,"c":"“Tehlikeli eğim (iniş)” yolunda balatalar ısınmasın diye küçük viteste motor freni kullanılır; araç boşta indirilmez.","g":"t-egim-inis"},{"d":"trafik","k":"Trafik işaretleri","q":"Şekildeki trafik işaretinin anlamı nedir?","o":["Sola tehlikeli devamlı vir lır."},{"d":"trafik","k":"Hız sınırları","q":"Aksine bir işaret bulunmadığında otomobil sürücüsü otoyolda en fazla kaç km/saat hızla gidebilir?","o":["90","100","110","120"],"a":3,"c":"KTY md. 100 tablosuna göre otomobil için otoyolda azami hız 120 km/saattir."},{"d":"trafik","k":"Hız sınırları","q":"Aksine bir işaret bulunmadığında otomobil sürücüsü şehirlerarası çift yönlü karayolunda en fazla kaç km/saat hızla gidebilir?","o":["70","80","90","110"],"a":2,"c":"KTK md. 50 ve KTY md. 100'e göre otomobil için şehirlerarası çift yönlü yolda sınır 90 km/saattir."},{"d":"trafik","k":"Hız sınırları","q":"Römork çeken bir otomobil, aksine bir işaret bulunmadığında otoyolda en fazla kaç km/saat hızla gidebilir?","o":["100","110","120","130"],"a":1,"c":"Römorklu araçlarda azami hız, aynı cins römorksuz aracınkinden 10 km/saat düşüktür: 120 - 10 = 110."},{"d":"trafik","k":"Hız sınırları","q":"Otoyolda uyulması gereken asgari hız kaç km/saattir?","o":["15","30","40","50"],"a":2,"c":"KTY md. 100'e göre otoyolda asgari hız 40 km/saattir."},{"d":"trafik","k":"Hız sınırları","q":"Otoyollar dışındaki şehirlerarası karayollarında uyulması gereken asgari hız kaç km/saattir?","o":["15","20","30","40"],"a":0,"c":"Şehirlerarası yollarda asgari hız 15 km/saat, otoyolda 40 km/saattir."},{"d":"trafik","k":"Hız sınırları","q":"Servis freni bozuk olan bir aracı çeken araç en fazla kaç km/saat hızla gidebilir?","o":["15","20","30","40"],"a":0,"c":"KTY md. 100'e göre servis freni bozuk aracı çeken araç 15 km/saati aşamaz."},{"d":"trafik","k":"Hız sınırları","q":"Aşağıdakilerden hangisi sürücünün hızını azaltmasını gerektiren durumlardan biri DEĞİLDİR?","o":["Yolun ıslak veya buzlu olması","Görüşün sis nedeniyle azalması","Okul geçidine yaklaşılması","Yolun düz, kuru ve trafiğin akıcı olması"],"a":3,"c":"Hız; yol, hava, görüş ve trafik durumuna göre ayarlanır. Düz, kuru ve akıcı yol hız azaltmayı gerektiren bir durum değildir."},{"d":"trafik","k":"Hız sınırları","q":"Şekildeki işaretin bulunduğu yolda otomobil sürücüsü için hangisi doğrudur?","o":["70 km/saatin altında gitmesi yasaktır","Hız sınırlaması sona ermiştir","En fazla 70 km/saat hızla gidebilir","Tavsiye edilen hız 70 km/saattir"],"a":2,"c":"Azami hız sınırlaması levhası, üzerindeki değerin aşılamayacağını bildirir.","g":"y-hiz-70"},{"d":"trafik","k":"Hız sınırları","q":"Yerleşim yeri dışındaki şehirlerarası çift yönlü bir yolda şekildeki işaret görülmüştür. Aksine başka bir işaret yoksa otomobil sürücüsü bundan sonra en fazla kaç km/saat hızla gidebilir?","o":["50","70","90","110"],"a":2,"c":"Hız sınırlaması sonu levhasından sonra genel kural geçerlidir: otomobil için şehirlerarası çift yönlü yolda 90 km/saat.","g":"y-hiz-sonu"},{"d":"trafik","k":"Takip mesafesi","q":"90 km/saat hızla giden bir otomobil, önündeki araçla arasında en az kaç metre mesafe bırakmalıdır?","o":["30","45","60","90"],"a":1,"c":"KTY md. 107: takip mesafesi en az hızın yarısı kadar metredir; 90 / 2 = 45 m."},{"d":"trafik","k":"Takip mesafesi","q":"Otoyolda 120 km/saat hızla giden bir sürücünün önündeki araçla arasında bırakması gereken en az mesafe kaç metredir?","o":["30","45","60","120"],"a":2,"c":"Hızın yarısı kadar metre kuralına göre 120 / 2 = 60 m bırakılmalıdır."},{"d":"trafik","k":"Takip mesafesi","q":"Tehlikeli madde taşıyan araçlar, yerleşim yeri dışında önlerindeki araçla aralarında en az kaç metre mesafe bırakmalıdır?","o":["20","30","40","50"],"a":3,"c":"KTY md. 107'ye göre tehlikeli madde taşıyan araçlar yerleşim yeri dışında en az 50 m takip mesafesi bırakır."},{"d":"trafik","k":"Takip mesafesi","q":"I. Konvoy hâlinde gidilirken geçiş yapan aracın girebileceği açıklık bırakılır.\nII. Takip mesafesi hızın en az yarısı kadar metredir.\nIII. Islak yolda takip mesafesi kısaltılmalıdır.\nTakip mesafesiyle ilgili verilenlerden hangileri doğrudur?","o":["Yalnız I","Yalnız III","I ve II","II ve III"],"a":2,"c":"Kaygan ve ıslak yolda duruş mesafesi uzadığından takip mesafesi kısaltılmaz, artırılır."},{"d":"trafik", <script>// Trafik işaretleri ve gösterge ışıkları — viewBox 0 0 100 100, tamamı çizim (internetsiz).

    "t-demiryolu-kontrolsuz": ["Kontrolsüz demiryolu geçidi", T(tren)],

    "t-isikli": ["Trafik ışıklı işaret cihazı", T(`<rect x="38" y="28" width="24" height="54" rx="6" fill="${S}"/><circle cx="50" cy="38" r="6" fill="#ff3b30"/><circle cx="50" cy="55" r="6" fill="#ffcc00"/><circle cx="50" cy="72" r="6" fill="#22c55e"/>`)],
    "t-donel-kavsak": ["Dönel kavşak", T(cz("M36 50 A16 16 0 0 1 60 38 M66 56 A16 16 0 0 1 46 70 M38 64 A16 16 0 0 1 36 52", 5) + `<path d="M58 30 L68 38 L56 44 Z M70 52 L64 64 L58 54 Z M30 66 L40 70 L30 58 Z" fill="${S}"/>`)],

    "t-gizli-buzlanma": ["Gizli buzlanma", T(cz("M50 26 V84 M25 40 L75 70 M25 70 L75 40", 6) + cz("M43 31 L50 38 L57 31 M43 79 L50 72 L57 79", 4))],

    "t-kasisli": ["Kasisli yol", T(`<path d="M18 80 H30 Q38 60 46 80 H54 Q62 60 70 80 H82 V84 H18 Z" fill="${S}"/>`)],
    "t-kiyi": ["Deniz veya nehir kıyısında biten yol", T(`<path d="M18 52 H46 V84 H18 Z" fill="${S}"/>${araba(58, 52)}${cz("M48 74 q5 -5 10 0 q5 5 10 0 q5 -5 10 0 M48 84 q5 -5 10 0 q5 5 10 0 q5 -5 10 0", 3.5)}`)],
    "t-egim-cikis": ["Tehlikeli eğim (çıkış)", T(`<path d="M20 82 H76 V46 Z" fill="${S}"/><text x="36" y="44" font-size="17" font-weight="900" font-family="Arial,sans-serif" text-anchor="middle" fill="${S}">%10</text>`)],

    // ---- durma / yol verme
    "dur": ["DUR", `<path d="M30 4 H70 L96 30 V70 L70 96 H30 L4 70 V30 Z" fill="${K}" stroke="#fff" stroke-width="3"/><text x="50" y="62" font-size="30" font-weight="900" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff">DUR</text>`],

/* ---------- ses + titreşim ---------- */
let ac;
function ses(t) {
  if (!S.ayar.ses) return;
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    const n = {ok:[660,990], bad:[200,150], tik:[520], win:[523,659,784,1046], lvl:[392,523,659,784,1046,1318]}[t];
    n.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * .09;
      o.type = t === "bad" ? "square" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(t === "bad" ? .06 : .16, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .2);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + .22);
    });
  } catch (e) {}
}
const titret = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- konfeti ---------- */
function konfeti(n = 140) {
  if (azHareket) return;
  const cv = $("#confetti"), cx = cv.getContext("2d");
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.scale(devicePixelRatio, devicePixelRatio);
  const renk = ["#fbbf24","#ff6ba6","#22d3ee","#7c5cff","#22c55e","#fff"];
  const p = Array.from({length:n}, () => ({x:innerWidth/2 + (Math.random()-.5)*120, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*16-4,
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*7, h:4+Math.random()*5, c:rnd(renk)}));
  let f = 0;
  (function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    p.forEach(q => { q.vy += .42; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += q.vr;
      cx.save(); cx.translate(q.x, q.y); cx.rotate(q.r); cx.fillStyle = q.c; cx.fillRect(-q.w/2, -q.h/2, q.w, q.h * Math.cos(f/6 + q.r)); cx.restore(); });
    if (++f < 170) requestAnimationFrame(tick); else cx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
function toast(e, t) {
  const d = document.createElement("div"); d.className = "toast"; d.innerHTML = `<span class="e">${e}</span><span>${esc(t)}</span>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3300);
}
function xpUcur(el, txt) {
  const r = el.getBoundingClientRect(), d = document.createElement("div");
  d.className = "xpfloat"; d.textContent = txt; d.style.left = (r.left + r.width/2) + "px"; d.style.top = (r.top) + "px";
  document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
}
function sayac(el, hedef, sure = 900) {
  if (!el) return; const t0 = performance.now();
  (function t(n) { const k = Math.min(1, (n - t0) / sure); el.textContent = Math.round(hedef * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(t); })(t0);
}

function soruSec(n, yol) {
  const H = yolHavuz(yol); if (!H.length) return [];
  const gruplar = {};
  H.forEach(q => { const k = DERS[q.d] ? q.d : "ek"; (gruplar[k] ||= []).push(q); });
  // az görülen önce, eşitler rastgele; dersler sırayla harmanlanır

  const sira = karistir(Object.keys(gruplar)), out = [];
  while (out.length < n && sira.some(k => gruplar[k].length)) for (const k of sira) { if (out.length < n && gruplar[k].length) out.push(gruplar[k].shift()); }
  return karistir(out);
}
