}

function cevapla(k) {
  if (!T || T.cevaplandi === T.i || elenen(T.sorular[T.i].id).has(T.sorular[T.i].perm[k])) return;
  T.cevaplandi = T.i;
  const q = T.sorular[T.i], ok = k === q.dogruK, btns = [...app.querySelectorAll(".opt")];
  btns.forEach((b, j) => { b.disabled = true; if (j === q.dogruK) b.classList.add("ok"); else if (j === k) b.classList.add("bad"); else b.classList.add("dim"); });
  S.gorulen[q.id] = (S.gorulen[q.id] || 0) + 1; S.cozulen++; turKontrol(dk(q));
  T.cevap.push({q, k, ok});
  let kazanc = 0;
  if (ok) {
    T.dogru++; T.combo++; T.maxCombo = Math.max(T.maxCombo, T.combo); S.dogru++;
    kazanc = 10 + Math.min(T.combo - 1, 5) * 2; T.xp += kazanc; S.xp += kazanc;
    if (S.yanlis[q.id]) { delete S.yanlis[q.id]; S.temiz++; if (S.temiz >= 10) rozetVer("defter"); }
    if (T.combo === 5) rozetVer("combo5"); if (T.combo === 10) rozetVer("combo10");
    ses("ok"); xpUcur(btns[k], "+" + kazanc + " XP");
    if (T.combo >= 3 && !azHareket) konfeti(40);
  } else {
    T.combo = 0; S.yanlis[q.id] = 1; ses("bad"); titret(120);
  }
  if (S.cozulen >= 100) rozetVer("yuz"); if (S.cozulen >= 500) rozetVer("bes");
  save();
  const c = $("#combo"); c.textContent = T.combo >= 2 ? "🔥" + T.combo : ""; c.classList.toggle("hot", T.combo >= 2);
  $("#pbar").style.width = ((T.i + 1) / T.sorular.length * 100) + "%";

  const sh = $("#sheet"), son = T.i === T.sorular.length - 1;
  sh.className = "sheet " + (ok ? "okk" : "badd");
  $("#sheetIn").innerHTML = `
    <div class="speaker">${koala(ok ? "happy" : "sad")}<div><h3>${esc(sz(rnd(ok ? DOGRU : YANLIS)))}</h3>
    ${ok ? "" : `<div style="font-weight:800;margin-top:4px">Doğru cevap: ${"ABCD"[q.dogruK]}) ${secenek(q, q.a)}</div>`}</div></div>
    ${q.c ? `<div class="exp"><b>Çözüm:</b> ${fmt(q.c)}</div>` : "<div style='height:12px'></div>"}
    ${q.src ? `<div class="src">Kaynak: ${esc(q.src)}</div><div style="height:10px"></div>` : ""}
    <button class="btn wide ${ok ? "ok" : "bad"}" id="devam">${son ? "Sonucu Gör 🏁" : "Devam →"}</button>`;
  requestAnimationFrame(() => sh.classList.add("open"));
  const qz = app.querySelector(".quiz"); if (qz) qz.style.paddingBottom = "60vh";
  setTimeout(() => $("#devam")?.focus({preventScroll:true}), 300);
  $("#devam").onclick = ilerle;
  canliYayinla();
}

async function ilerle() {
  if (!T) return;
  $("#sheet")?.classList.remove("open");
  T.i++;
  if (T.i >= T.sorular.length) return sonuc();
  const n = T.sorular.length;
  // dikkat molası: yarıda bir kez, ya da 3 yanlış üst üste
  const sonUc = T.cevap.slice(-3);
  if (S.ayar.mola && n >= 6 && !T.molaVerildi && T.i === Math.floor(n / 2)) {
    T.molaVerildi = true;
    const [b, ipucu] = rnd(MOLA).map(sz);
    await overlay(`<div class="ov-card">${koala("happy")}<h2>${esc(b)}</h2><p>${T.dogru} / ${T.i} doğru · ${T.xp} XP topladın</p>
      ${b.includes("Nefes") ? '<div class="breath">nefes</div>' : ""}<div class="tip">💡 ${esc(ipucu)}</div><button class="btn gold wide" data-kapat>Devam et!</button></div>`);
  } else if (S.ayar.mola && sonUc.length === 3 && sonUc.every(c => !c.ok) && !T.teselli) {
    T.teselli = true;
    await overlay(`<div class="ov-card">${koala("sad")}<h2>${esc(sz("Hey {h}, moral bozmak yok! 🤗"))}</h2><p>Zor sorular en çok öğreten sorulardır. Hepsini defterine yazdım, birlikte tekrar edeceğiz. Ben sana inanıyorum 💗</p>
      <div class="tip">💡 Soruyu okurken anahtar kelimelerin altını zihninde çiz.</div><button class="btn gold wide" data-kapat>Hadi devam!</button></div>`);
  }
  soruGoster();
}

/* ================= SONUÇ ================= */
const incele = (L, yd = new Set()) => L.map((c, i) => `<details class="rv"><summary>${c.ok ? "✅" : c.k < 0 ? "⬜" : "❌"} <span>${i + 1}. ${yd.has(c.q.id) ? "💞 " : ""}${esc(c.q.q.replace(/\s+/g, " ").slice(0, 80))}…</span></summary>
  <div class="body">${gorsel(c.q)}${fmt(c.q.q)}\n\n<b>Doğru:</b> ${secenek(c.q, c.q.a)}${c.ok ? "" : c.k < 0 ? "\n<b>Senin:</b> boş bıraktın" : `\n<b>Senin:</b> ${secenek(c.q, c.q.perm[c.k])}`}${c.q.c ? `\n\n<b>Çözüm:</b> ${fmt(c.q.c)}` : ""}</div></details>`).join("");
async function sonuc() {
  const n = T.sorular.length, d = T.dogru, p = Math.round(d / n * 100);
  const yildiz = p >= 90 ? 3 : p >= 70 ? 2 : p >= 50 ? 1 : 0;
  const lvOnce = seviye(S.xp).lv;
  let bonus = 0;
  if (T.tip === "test") {
    bonus = 20 + yildiz * 10;
    const TT = yolTest(T.yol), eski = TT[T.no];
    TT[T.no] = {yildiz:Math.max(yildiz, eski?.yildiz || 0), en:Math.max(d, eski?.en || 0)};
    rozetVer("ilk");
    if ([...Array(S.ayar.testSayisi).keys()].every(i => TT[i])) rozetVer("harita");
  }
  if (d === n && n >= 5) rozetVer("kusursuz");
  S.xp += bonus; T.xp += bonus;
  seriGuncelle(); save();
  const lvSonra = seviye(S.xp).lv, sure = Math.round((Date.now() - T.t0) / 1000);
  const mesaj = esc(sz(p >= 90 ? "Muhteşemsin {h}! Seninle gurur duyuyorum 🏆💖" : p >= 70 ? "Çok iyi {h}! Biraz daha ve zirvedesin 🚀💕" : p >= 50 ? "Güzel gidiyor {h}, yanlışları birlikte tekrar edelim 💪❤️" : "Her uzman bir zamanlar acemiydi {h}, ben sana inanıyorum 🌱💗"));
  const sonraki = T.tip === "test" && T.no + 1 < S.ayar.testSayisi ? T.no + 1 : null;
  const R = T;
  C.sonuc = {ekran:"sonuc", puan:p, dogru:d, toplam:n};

  goster(`
  <div class="result">
    <div class="speaker" style="justify-content:center">${koala(p >= 50 ? "happy" : "sad")}<div class="bubble">${mesaj}</div></div>
    <h2 style="font-size:24px;font-weight:900;margin-top:14px">${R.tip === "test" ? `${esc(yolAd(R.yol))} · Test ${R.no + 1} bitti!` : "Yanlışlar tekrarı bitti!"}</h2>
    ${R.tip === "test" ? `<div class="bigstars">${[1,2,3].map(k => `<i class="${k <= yildiz ? "" : "off"}" style="animation-delay:${.3 + k * .25}s">⭐</i>`).join("")}</div>` : ""}
    <div class="ring" id="ring" style="--p:0"><div><b>${d}/${n}</b><span>%${p} başarı</span></div></div>
    <div class="rstats">
      <div class="stat"><b>+<span id="rx">0</span></b><span>XP</span></div>
      <div class="stat"><b>🔥${R.maxCombo}</b><span>En iyi seri</span></div>
      <div class="stat"><b>${Math.floor(sure / 60)}:${String(sure % 60).padStart(2, "0")}</b><span>Süre</span></div>
    </div>
    <div class="racts">
      ${sonraki !== null ? `<button class="btn gold wide" id="r-next">Sonraki Test (${sonraki + 1}) →</button>` : ""}
      ${R.cevap.some(c => !c.ok) ? `<button class="btn wide bad" id="r-yanlis">📒 Yanlışları Tekrar Et</button>` : ""}
      <button class="btn ghost wide" id="r-tekrar">🔄 Yeni Sorularla Tekrar</button>
      <button class="btn ghost wide" id="r-ev">🏠 Haritaya Dön</button>
    </div>
    <div class="review"><h2 class="sec">Cevapların</h2>
      ${incele(R.cevap, R.yardimli)}
    </div>
  </div>`, () => {
    setTimeout(() => { $("#ring").style.setProperty("--p", p); }, 200);
    sayac($("#rx"), R.xp, 1200);
    if (p >= 70) { konfeti(); ses("win"); }
    $("#r-next") && ($("#r-next").onclick = () => testBaslat({tip:"test", yol:R.yol, no:sonraki}));
    $("#r-yanlis") && ($("#r-yanlis").onclick = () => testBaslat({tip:"yanlis"}));
    $("#r-tekrar").onclick = () => testBaslat(R.tip === "test" ? {tip:"test", yol:R.yol, no:R.no} : {tip:"yanlis"});
    $("#r-ev").onclick = anaSayfa;
    if (lvSonra > lvOnce) setTimeout(() => {
      ses("lvl"); konfeti(200);
      overlay(`<div class="ov-card">${koala("happy")}<h2>Seviye ${lvSonra}! 🎉</h2><p>Yeni unvanın: <b>${seviye(S.xp).unvan}</b></p><div class="tip">Kucak Kucak da Minik Minik de seninle gurur duyuyor 💖</div><button class="btn gold wide" data-kapat>Süper!</button></div>`);
    }, 1400);
  });
  T = null;
}

/* ================= GERÇEK SINAV ================= */
const SINAV_DAG = {ilkyardim:12, trafik:23, motor:9, adap:6}, SINAV_SURE = 45 * 60;
let E = null, sinavSaat = null;
const kalanSn = () => E ? Math.max(0, Math.round((E.bitis - Date.now()) / 1000)) : 0;
const ss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

async function sinavBaslat() {
  if (basliyor) return;
  const sorular = Object.entries(SINAV_DAG).flatMap(([d, n]) => soruSec(n, d));
  if (sorular.length < 10) { toast("⚠️", "Sınav için yeterli soru yok"); return; }
  T = null; oturumSifirla();
  E = {sorular:sorular.map(hazirla), i:0, secim:Array(sorular.length).fill(-1), bitis:Infinity, yardimli:new Set(), joker:{}, t0:Date.now()};
  basliyor = true;
  if (!azHareket) await geriSayim();
  basliyor = false;
  E.bitis = Date.now() + SINAV_SURE * 1000; E.t0 = Date.now();
  clearInterval(sinavSaat); sinavSaat = setInterval(sinavTik, 1000);
  sinavGoster();
}
function sinavTik() {
  if (!E) return clearInterval(sinavSaat);
  const k = kalanSn(), el = $("#sure");
  if (el) { el.textContent = "⏱ " + ss(k); el.classList.toggle("az", k <= 300); }
  if (k <= 0) { toast("⏰", "Süre doldu!"); sinavBitir(); }
}
function sinavGoster() {
  const q = E.sorular[E.i], n = E.sorular.length, D = DERS[dk(q)], dolu = E.secim.filter(x => x >= 0).length;
  goster(`
  <div class="quiz">
    <div class="qtop">
      <button class="x" id="cik" aria-label="Sınavdan çık">✕</button>
      <div class="bar"><i id="pbar" style="width:${dolu / n * 100}%"></i></div>
      <div class="sure ${kalanSn() <= 300 ? "az" : ""}" id="sure">⏱ ${ss(kalanSn())}</div>
      ${yardimBtn()}
    </div>
    <div class="qmeta"><span class="dchip" style="--c:${D.c}">${D.ic} ${esc(D.ad)}</span><span>📝 ${E.i + 1} / ${n}</span></div>
    <div class="qcard">${gorsel(q)}${fmt(q.q)}</div>
    <div class="opts" role="group" aria-label="Seçenekler">
      ${q.perm.map((oi, k) => `<button class="opt ${E.secim[E.i] === k ? "sec" : ""} ${elenen(q.id).has(oi) ? "elendi" : ""}" style="--i:${k}" data-k="${k}" data-oi="${oi}"><span class="l">${"ABCD"[k]}</span><span>${secenek(q, oi)}</span></button>`).join("")}
    </div>
    <div class="nav"><button class="btn ghost" id="onceki" ${E.i ? "" : "disabled"}>← Önceki</button><button class="btn" id="sonraki">${E.i < n - 1 ? "Sonraki →" : "Bitir 🏁"}</button></div>
    <div class="palet" aria-label="Soru paleti">${E.sorular.map((_, j) => `<button class="${E.secim[j] >= 0 ? "dolu" : ""} ${j === E.i ? "su" : ""}" data-j="${j}" aria-label="Soru ${j + 1}">${j + 1}</button>`).join("")}</div>
    <button class="btn bad wide" id="bitir" style="margin-top:18px">Sınavı Bitir</button>
    <div class="kbd">Klavye: A–D veya 1–4 ile seç · ← → ile soru değiştir</div>
  </div>`, () => {
    const ikiDokun = (el, soru, yap) => el.onclick = () => { if (!el.dataset.o) { el.dataset.o = 1; el.textContent = soru; return; } yap(); };
    ikiDokun($("#cik"), "?", () => { clearInterval(sinavSaat); E = null; anaSayfa(); });
    $("#cik").addEventListener("click", () => $("#cik").dataset.o && toast("⚠️", "Çıkmak için ✕'e tekrar dokun; sınav silinir"), {once:true});
    $("#yardim") && ($("#yardim").onclick = yardimIste);
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => sinavSec(+b.dataset.k));
    $("#onceki").onclick = () => sinavGit(E.i - 1);
    $("#sonraki").onclick = () => E.i < E.sorular.length - 1 ? sinavGit(E.i + 1) : $("#bitir").click();
    app.querySelectorAll(".palet button").forEach(b => b.onclick = () => sinavGit(+b.dataset.j));
    const bos = E.secim.filter(x => x < 0).length;
    ikiDokun($("#bitir"), bos ? `${bos} boş soru var. Yine de bitir?` : "Emin misin? Bitir", sinavBitir);
  });
}
function sinavSec(k) {
  if (!E) return;
  const q = E.sorular[E.i];
  if (k >= q.o.length || elenen(q.id).has(q.perm[k])) return;
  E.secim[E.i] = k; ses("tik");
  app.querySelectorAll(".opt").forEach((b, j) => b.classList.toggle("sec", j === k));
  app.querySelector(`.palet [data-j="${E.i}"]`)?.classList.add("dolu");
  const p = $("#pbar"); if (p) p.style.width = E.secim.filter(x => x >= 0).length / E.sorular.length * 100 + "%";
  canliYayinla();
}
function sinavGit(j) { if (!E || j < 0 || j >= E.sorular.length || j === E.i) return; E.i = j; sinavGoster(); }

function sinavBitir() {
  if (!E) return;
  clearInterval(sinavSaat);
  const R = E; E = null;
  const L = R.sorular.map((q, j) => ({q, k:R.secim[j], ok:R.secim[j] === q.dogruK}));
  const dogru = L.filter(c => c.ok).length, puan = Math.round(dogru / L.length * 100), gecti = puan >= 70;
  L.forEach(c => {
    S.gorulen[c.q.id] = (S.gorulen[c.q.id] || 0) + 1; S.cozulen++;
    if (c.ok) { S.dogru++; if (S.yanlis[c.q.id]) { delete S.yanlis[c.q.id]; S.temiz++; } } else S.yanlis[c.q.id] = 1;
  });
  Object.keys(SINAV_DAG).forEach(turKontrol);
  const lvOnce = seviye(S.xp).lv, xp = dogru * 4 + (gecti ? 100 : 0);
  S.xp += xp;
  S.sinavlar.unshift({t:Date.now(), puan, gecti, yardim:R.yardimli.size > 0}); S.sinavlar = S.sinavlar.slice(0, 10);
  if (gecti) rozetVer("ehliyet"); if (puan === 100) rozetVer("tampuan");
  if (S.cozulen >= 100) rozetVer("yuz"); if (S.cozulen >= 500) rozetVer("bes");
  if (S.temiz >= 10) rozetVer("defter");
  seriGuncelle(); save();
  const ders = {}; L.forEach(c => { const d = dk(c.q); ders[d] ||= [0, 0]; ders[d][1]++; if (c.ok) ders[d][0]++; });
  const sure = Math.round((Date.now() - R.t0) / 1000), lvSonra = seviye(S.xp).lv;
  C.sonuc = {ekran:"sonuc", puan, gecti, dogru, toplam:L.length, yardim:R.yardimli.size};
  goster(`
  <div class="result">
    <div class="speaker" style="justify-content:center">${koala(gecti ? "happy" : "sad")}<div class="bubble">${esc(gecti ? sz("GEÇTİN {h}! Direksiyon artık senin 🚗💖") : "Az kaldı Karıcımm 💗 Bir dahakine kesin geçiyoruz!")}</div></div>
    <h2 class="gecti-baslik ${gecti ? "ok" : "bad"}">${gecti ? "GEÇTİN 🎉" : "KALDIN 😢"}</h2>
    <div class="ring" id="ring" style="--p:0"><div><b>${puan}</b><span>puan · ${dogru}/${L.length} doğru</span></div></div>
    ${R.yardimli.size ? `<p class="note" style="text-align:center">💞 ${R.yardimli.size} soruda yardım alındı</p>` : ""}
    <div class="rstats">${Object.entries(ders).map(([d, [a, b]]) => `<div class="stat"><b>${a}/${b}</b><span>${DERS[d].ic} ${esc(DERS[d].ad)}</span></div>`).join("")}<div class="stat"><b>${ss(sure)}</b><span>⏱ Süre</span></div><div class="stat"><b>+${xp}</b><span>XP</span></div></div>
    <div class="racts">
      <button class="btn gold wide" id="r-tekrar">📝 Yeni Sınav</button>
      ${L.some(c => !c.ok) ? `<button class="btn wide bad" id="r-yanlis">📒 Yanlışları Tekrar Et</button>` : ""}
      <button class="btn ghost wide" id="r-ev">🏠 Ana Sayfa</button>
    </div>
    <div class="review"><h2 class="sec">Cevapların</h2>${incele(L, R.yardimli)}</div>
  </div>`, () => {
    setTimeout(() => { $("#ring").style.setProperty("--p", puan); }, 200);
    if (gecti) { konfeti(220); ses("win"); } else ses("bad");
    $("#r-tekrar").onclick = sinavBaslat;
    $("#r-yanlis") && ($("#r-yanlis").onclick = () => testBaslat({tip:"yanlis"}));
    $("#r-ev").onclick = anaSayfa;
    if (lvSonra > lvOnce) setTimeout(() => {
      ses("lvl"); konfeti(200);
      overlay(`<div class="ov-card">${koala("happy")}<h2>Seviye ${lvSonra}! 🎉</h2><p>Yeni unvanın: <b>${seviye(S.xp).unvan}</b></p><div class="tip">Kucak Kucak da Minik Minik de seninle gurur duyuyor 💖</div><button class="btn gold wide" data-kapat>Süper!</button></div>`);
    }, 1600);
  });
}

/* ================= CANLI BİRLİKTE ÇÖZÜM — Firebase Realtime Database, REST + EventSource (SDK yok) ================= */
const FB = "https://ehliyet-koala-00ra5-default-rtdb.europe-west1.firebasedatabase.app";
const IZLE = new URLSearchParams(location.search).get("izle");
const SITE = location.protocol.startsWith("http") ? location.origin + location.pathname : "https://dalezepul.github.io/ehliyet/";
const C = {es:null, tampon:null, islenen:new Set(), sonuc:null, bagli:false};
const canliAcik = () => !!(FB && !IZLE && S.canli.kod && S.canli.acik);
const fbUrl = (kod, yol) => `${FB}/odalar/${kod}/${yol}.json`;
const izleLink = () => `${SITE}?izle=${S.canli.kod}`;
const yeniKod = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
const yardimBtn = () => canliAcik() ? `<button class="yardim-btn" id="yardim" aria-label="Eşinden yardım iste">🙋 Yardım</button>` : "";
const JOKER_LIMIT = {}; // jokerler sınırsız (sınır koymak için ör. {yari:1})

function canliDurum() {
  if (E) { const q = E.sorular[E.i];
    return {ekran:"sinav", qid:q.id, no:E.i, toplam:E.sorular.length, perm:q.perm, secim:E.secim[E.i], kalan:kalanSn(),
      palet:E.secim.map(x => x >= 0 ? "x" : ".").join(""), elenen:[...elenen(q.id)], joker:E.joker}; }
  if (T) { const q = T.sorular[T.i], cev = T.cevaplandi === T.i ? T.cevap[T.cevap.length - 1] : null;
    return {ekran:"test", ders:T.tip === "yanlis" ? "Yanlışlarım" : yolAd(T.yol), qid:q.id, no:T.i, toplam:T.sorular.length, perm:q.perm,
      secim:cev ? cev.k : -1, cevaplandi:!!cev, dogru:T.dogru, yanlis:T.cevap.filter(c => !c.ok).length,
      palet:T.sorular.map((_, j) => j < T.cevap.length ? (T.cevap[j].ok ? "d" : "y") : ".").join(""), elenen:[...elenen(q.id)], joker:T.joker}; }
  return C.sonuc || {ekran:"ana"};
}
function canliYayinla() {
  if (!canliAcik()) return;
  clearTimeout(C.tampon);
  C.tampon = setTimeout(() => fetch(fbUrl(S.canli.kod, "durum"), {method:"PUT", body:JSON.stringify({...canliDurum(), ts:{".sv":"timestamp"}})}).catch(() => {}), 250);
}
function canliBaglan() {
  C.es?.close(); C.es = null;
  if (!canliAcik()) return;
  const kod = S.canli.kod;
  fetch(fbUrl(kod, "komut"), {method:"DELETE"}).catch(() => {}).finally(() => {
    if (kod !== S.canli.kod || !canliAcik()) return;
    const es = C.es = new EventSource(fbUrl(kod, "komut"));
    es.addEventListener("put", e => {
      const {path, data} = JSON.parse(e.data);
      if (path === "/") { if (data) Object.keys(data).forEach(id => C.islenen.add(id)); return; }
      const id = path.slice(1).split("/")[0];
      if (!data || C.islenen.has(id)) return;
      C.islenen.add(id); komutIsle(data);
    });
    es.onopen = () => { C.bagli = true; }; es.onerror = () => { C.bagli = false; };
  });
  canliYayinla();
}
function eleUygula(q, liste) {
  liste.forEach(oi => {
    elenen(q.id).add(oi);
    app.querySelector(`.opt[data-oi="${oi}"]`)?.classList.add("elendi");

    ikiDokun($("#yanlissifir"), "Emin misin? Tekrar dokun", () => { S.yanlis = {}; save(); toast("📒", "Defter temizlendi"); ayarlar(); });
    ikiDokun($("#sifirla"), "Emin misin? Her şey silinecek, tekrar dokun", () => {
      const ek = S.ek, ayar = S.ayar, canli = S.canli; S = VARS(); S.ek = ek; S.ayar = ayar; S.canli = canli; save(); toast("🧽", "Sıfırlandı, yeni bir başlangıç 💕"); anaSayfa();
    });
  });
}

/* ================= SORU EKLE ================= */
const ORNEK = [{d:"trafik",k:"Trafik işaretleri",q:"Şekildeki trafik işaretinin anlamı nedir?",g:"y-girilmez",o:["Girilmez","Park etmek yasaktır","Taşıt trafiğine kapalı yol","Dur"],a:0,c:"Kırmızı daire içindeki beyaz yatay bant girilmez anlamındadır."}];
function soruEkle() {
  goster(`
  <div class="quiz">
    <header class="top"><button class="btn ghost" id="geri">← Geri</button><h2 style="font-weight:900">Soru Ekle</h2><span style="width:80px"></span></header>
    <section class="panel glass">
      <h3>JSON dosyası ya da metin</h3>
      <p class="note">Her soru: <b>d</b> ders (${Object.keys(DERS).join(", ")}), <b>k</b> konu, <b>q</b> soru, <b>o</b> şıklar (2–5), <b>a</b> doğru şıkkın sırası (0'dan başlar), <b>c</b> çözüm. Altı çizili ifade için <b>[[kelime]]</b> yaz.</p>
      <pre class="ex">${esc(JSON.stringify(ORNEK, null, 1))}</pre>
      <input type="file" accept=".json,application/json" id="dosya" style="margin:8px 0 12px">
      <textarea id="metin" placeholder="[ { &quot;d&quot;: &quot;turkce&quot;, ... } ]" aria-label="Soru JSON metni"></textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <button class="btn gold" id="yukle">Ekle</button><button class="btn ghost" id="indir">Örnek indir</button>
      </div>
      <div class="msg" id="msg"></div>
    </section>
    <section class="panel glass">
      <h3>Eklediğin sorular: ${S.ek.length}</h3>
      ${S.ek.length ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost" id="disa">Dışa aktar</button><button class="btn bad" id="sil">Hepsini sil</button></div>` : '<p class="note">Henüz yok.</p>'}
    </section>
  </div>`, () => {
    $("#geri").onclick = anaSayfa;
    const msg = (t, ok) => { const m = $("#msg"); m.className = "msg " + (ok ? "ok" : "bad"); m.textContent = t; };
    const indir = (ad, veri) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(veri, null, 1)], {type:"application/json"})); a.download = ad; a.click(); };
    $("#dosya").onchange = async e => { const f = e.target.files[0]; if (f) $("#metin").value = await f.text(); };
    $("#indir").onclick = () => indir("ornek-sorular.json", ORNEK);
    $("#disa") && ($("#disa").onclick = () => indir("sorularim.json", S.ek));
    $("#sil") && ($("#sil").onclick = e => { if (e.target.dataset.o) { S.ek = []; save(); soruEkle(); } else { e.target.dataset.o = 1; e.target.textContent = "Emin misin?"; } });
    $("#yukle").onclick = () => {
      let arr; try { arr = JSON.parse($("#metin").value); } catch (e) { return msg("JSON okunamadı: " + e.message, false); }
      if (!Array.isArray(arr)) arr = [arr];
      const var_ = new Set(tumu().map(q => q.id)), iyi = [], hata = [];
      arr.forEach((q, i) => {
        const ok = q && typeof q.q === "string" && q.q.trim() && Array.isArray(q.o) && q.o.length >= 2 && q.o.length <= 5 && q.o.every(x => typeof x === "string")
          && Number.isInteger(q.a) && q.a >= 0 && q.a < q.o.length;
        if (!ok) return hata.push(i + 1);
        const s = {d:DERS[q.d] ? q.d : "ek", k:String(q.k || ""), q:q.q, o:q.o, a:q.a, c:String(q.c || ""), ...(ISARET[q.g] ? {g:q.g} : {}), ...(q.og && q.o.every(x => ISARET[x]) ? {og:true} : {})};
        s.id = hash(s.q + s.o.join("|"));
        if (!var_.has(s.id)) { var_.add(s.id); iyi.push(s); }
      });
      S.ek.push(...iyi); save();
      msg(`${iyi.length} soru eklendi.` + (hata.length ? ` Hatalı kayıtlar: ${hata.slice(0, 10).join(", ")}` : ""), iyi.length > 0);
      if (iyi.length) { ses("win"); konfeti(60); }
    };
  });
}

/* ---------- klavye ---------- */
document.addEventListener("keydown", e => {
  if (document.querySelector(".overlay") || e.target.matches("input,textarea")) return;
  const k = "abcd".indexOf(e.key.toLowerCase()), n = "1234".indexOf(e.key);
  const sec = k >= 0 ? k : n;
  if (E) { if (sec >= 0) sinavSec(sec); else if (e.key === "ArrowRight") sinavGit(E.i + 1); else if (e.key === "ArrowLeft") sinavGit(E.i - 1); return; }
  if (!T) return;
  if (sec >= 0 && T.cevaplandi !== T.i && sec < T.sorular[T.i].o.length) cevapla(sec);
  else if (e.key === "Enter" && T.cevaplandi === T.i && document.activeElement?.id !== "devam") { e.preventDefault(); ilerle(); }
});

  ["💕","🚗","✨","🐨","🚦","🌸","⭐","💖"].forEach((e, i) => { const f = document.createElement("i"); f.className = "floater"; f.textContent = e;
    f.style.cssText = `left:${5 + i * 12}%;animation-duration:${26 + i * 4}s;animation-delay:${-i * 5}s;font-style:normal`; bg.appendChild(f); });
})();

if (IZLE && FB) izleyici(IZLE);
else { anaSayfa(); canliBaglan(); setInterval(() => canliAcik() && canliYayinla(), 5000); }
